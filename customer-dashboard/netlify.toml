[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Deploy successful'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[redirects]]
  from = "/twilio/status-callback"
  to = "/.netlify/functions/twilio-status-callback"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."cleanup-stale-calls"]
  schedule = "*/5 * * * *"

[functions."enforce-data-retention"]
  schedule = "17 3 * * *"
