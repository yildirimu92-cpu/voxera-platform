[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Deploy successful'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
