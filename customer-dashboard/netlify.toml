[build]
  publish = "."
  functions = "netlify/functions"
  # Erzeugt vx-runtime-config.js aus den Netlify-Env-Variablen. Sind SUPABASE_URL
  # und SUPABASE_ANON_KEY fuer den Kontext nicht gesetzt (Deploy-Preview), enthaelt
  # die Datei bewusst keine Zugangsdaten und die Anwendung startet ohne
  # Datenverbindung. Der Schritt bricht deshalb NICHT ab, wenn Variablen fehlen.
  command = "node tools/build-runtime-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


[[redirects]]
  from = "/twilio/status-callback"
  to = "/.netlify/functions/twilio-status-callback"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."cleanup-stale-calls"]
  schedule = "*/5 * * * *"

[functions."enforce-data-retention"]
  schedule = "17 3 * * *"
