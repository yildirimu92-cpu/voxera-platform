name: P0 Security Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify P0 security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository security checks
        run: node scripts/verify-p0-security-foundation.mjs

      - name: Verify Phase 1 launch gates
        run: node scripts/verify-phase1-launch-gates.mjs

      - name: Verify admin-controlled cancellations
        run: node scripts/verify-admin-controlled-cancellations.mjs
