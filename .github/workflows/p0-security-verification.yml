name: P0 Security Verification

on:
  pull_request:
    branches:
      - main
      - fix/contract-termination-operational-state-2026-07-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify P0 security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository security checks
        run: node scripts/verify-p0-security-foundation.mjs

      - name: Verify Phase 1 launch gates
        run: node scripts/verify-phase1-launch-gates.mjs

      - name: Verify Billing mail controls
        run: node scripts/verify-billing-mail-controls.mjs

      - name: Verify admin runtime patches
        run: node scripts/verify-admin-runtime-patches.mjs

      - name: Verify case system separation
        run: node scripts/verify-case-separation.mjs

      - name: Verify admin UX feedback fixes
        run: node scripts/verify-admin-ux-feedback.mjs

      - name: Verify admin operations workflow
        run: node scripts/verify-admin-operations-v3.mjs

      - name: Verify case state and status hotfix
        run: node scripts/verify-cases-state-status-hotfix.mjs

      - name: Verify launch sync and website flows
        run: node scripts/verify-launch-sync-website.mjs

      - name: Verify launch readiness gate
        run: node scripts/verify-launch-readiness-gate.mjs

      - name: Verify protected customer writes
        run: node scripts/verify-admin-customer-write-integrity.mjs

      - name: Verify contract termination operational state
        run: node scripts/verify-contract-termination-operational-state.mjs

      - name: Verify invoice adjustments and credit notes
        run: node scripts/verify-invoice-adjustments.mjs

      - name: Verify Admin design system V2
        run: node scripts/verify-admin-design-system-v2.mjs
