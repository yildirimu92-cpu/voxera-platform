name: Verify Wizard/customer_request prev_values

on:
  pull_request:
    paths:
      - 'admin-panel/index.html'
      - 'admin-panel/netlify/functions/trigger-elevenlabs-sync.js'
      - 'scripts/verify-prev-values-wizard-customer-request.mjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-prev-values-wizard-customer-request.mjs
