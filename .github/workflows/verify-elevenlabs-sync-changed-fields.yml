name: Verify ElevenLabs sync changed_fields

on:
  pull_request:
    paths:
      - 'admin-panel/netlify/functions/trigger-elevenlabs-sync.js'
      - 'admin-panel/netlify/functions/_lib/elevenlabs-sync.js'
      - 'scripts/verify-elevenlabs-sync-changed-fields.mjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-elevenlabs-sync-changed-fields.mjs
