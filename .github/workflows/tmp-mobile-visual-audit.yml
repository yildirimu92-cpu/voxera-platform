name: Temporary Mobile Visual Audit

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-mobile-visual-audit.yml'
      - 'customer-dashboard/index.html'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect focused mobile UI owners
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = source.splitlines()

          def show_hits(label, needles, radius=8, max_hits=12):
              print(f'\n===== {label} =====')
              hits = [i for i, line in enumerate(lines) if any(needle in line for needle in needles)]
              print('hits:', [i + 1 for i in hits[:max_hits]], 'total=', len(hits))
              for idx in hits[:max_hits]:
                  start = max(0, idx - radius)
                  end = min(len(lines), idx + radius + 1)
                  print(f'--- {start + 1}-{end} ---')
                  for pos in range(start, end):
                      print(f'{pos + 1:05d}: {lines[pos]}')

          def show_range(label, start, end):
              print(f'\n===== {label} {start}-{end} =====')
              for pos in range(start - 1, min(end, len(lines))):
                  print(f'{pos + 1:05d}: {lines[pos]}')

          show_hits('BOTTOM NAV HTML', ['id="mnav-'], radius=5, max_hits=20)
          show_hits('BOTTOM NAV ACTIVE CSS', ['.mobile-nav-btn.active', '.mobile-nav-icon-wrap::before', '.mobile-nav-btn:focus', '.mobile-nav-btn:active'], radius=5, max_hits=30)
          show_hits('ARCHIVE SPLIT CSS', ['.vx-split{', '.vx-split-left{', '.vx-split-filters{', '#archiv-split', '#archiv-split-left'], radius=7, max_hits=30)
          show_hits('HIDDEN AND DASH COMPONENT CSS', ['[hidden]', '.vx-ops-status', '.vx-ap-actions', '.vx-ap-btn{'], radius=5, max_hits=35)
          show_range('DASHBOARD DATE RENDER', 21950, 21995)
          show_range('SHOW TAB', 27290, 27310)
          PY
