name: Temporary Mobile Visual Audit

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-mobile-visual-audit.yml'
      - 'customer-dashboard/index.html'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact mobile UI owners
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = source.splitlines()

          def show(label, needles, radius=12, max_hits=8):
              print(f'\n===== {label} =====')
              hits = []
              for idx, line in enumerate(lines):
                  if any(needle in line for needle in needles):
                      hits.append(idx)
              print('hits:', [i + 1 for i in hits[:max_hits]], 'total=', len(hits))
              for idx in hits[:max_hits]:
                  start = max(0, idx - radius)
                  end = min(len(lines), idx + radius + 1)
                  print(f'--- lines {start + 1}-{end} around {idx + 1} ---')
                  for pos in range(start, end):
                      print(f'{pos + 1:05d}: {lines[pos]}')

          show('ARCHIVE MARKUP', ['Noch keine archivierten Einträge', 'Diese Woche', 'Dieser Monat', 'Archiv'], radius=18, max_hits=12)
          show('ARCHIVE CSS', ['archive-filter', 'archiv-filter', 'archive-tabs', 'archiv-tabs', 'retention', 'archive-empty', 'archiv-empty'], radius=12, max_hits=20)
          show('MOBILE NAV MARKUP', ['mobile-nav', 'bottom-nav', 'mob-nav', 'mnav'], radius=10, max_hits=30)
          show('TAB SWITCHING', ['function showTab', "classList.add('active')", "classList.toggle('active')", 'data-tab'], radius=18, max_hits=30)
          show('DASHBOARD MOBILE', ['dash-greeting-block', 'dash-datetime-label', 'dash-reach-warning', 'dash-recent-more', 'Alle offenen Punkte anzeigen'], radius=14, max_hits=20)
          show('ASSISTANT COMPONENT CSS', ['.vx-page-header', '.vx-ap-head', '.vx-ap-btn', '.vx-ap-actions', '.vx-ops-status'], radius=10, max_hits=30)
          PY
