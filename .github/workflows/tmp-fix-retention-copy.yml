name: Temporary Retention Copy Correction

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-fix-retention-copy.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
      - name: Keep retention note only in archive empty state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('customer-dashboard/index.html')
          text = path.read_text(encoding='utf-8')
          old = "if (filter === 'archiv') return 'Archiv ist leer. Audio und vollständige Transkripte werden nach 90 Tagen, Archiveinträge nach 180 Tagen gelöscht.';"
          new = "if (filter === 'archiv') return 'Archiv ist leer. Audio und vollständige Transkripte werden nach <strong>90 Tagen</strong> entfernt, Archiveinträge nach <strong>180 Tagen</strong> gelöscht.';"
          if old not in text and new not in text:
              raise SystemExit('archive empty-state copy not found')
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate retention and product contracts
        run: |
          node scripts/verify-p0-security-foundation.mjs
          node scripts/verify-customer-design-foundation.mjs
          node scripts/verify-calendar-integrations.mjs
      - name: Commit correction
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add customer-dashboard/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep retention copy in archive empty state'
          git push origin HEAD:codex/customer-navigation-five-root
