name: Temporary Retention Copy Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-fix-retention-copy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
      - name: Print retention copy locations
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if 'Archiv ist leer' in line or '90 Tagen' in line or '180 Tagen' in line:
                  for j in range(max(0, i-2), min(len(lines), i+3)):
                      print(f'{j+1}: {lines[j]}')
                  print('---')
          PY
