name: Verify AI Setup Identity Preservation

on:
  pull_request:
    paths:
      - 'admin-panel/index.html'
      - 'scripts/verify-ai-setup-identity-preservation.mjs'
      - '.github/workflows/verify-ai-setup-identity-preservation.yml'
  push:
    branches: [main]
    paths:
      - 'admin-panel/index.html'
      - 'scripts/verify-ai-setup-identity-preservation.mjs'
      - '.github/workflows/verify-ai-setup-identity-preservation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-ai-setup-identity-preservation.mjs
