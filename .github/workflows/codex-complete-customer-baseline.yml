name: Codex Complete Customer Baseline

on:
  push:
    branches:
      - codex/tmp-complete-customer-baseline-20260806

permissions:
  contents: write
  pull-requests: read

jobs:
  complete-baseline:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: b555e9896e8bbd66b86ce24ad20edb48f3d204d1
      TARGET_BRANCH: codex/restore-customer-launch-checks
    steps:
      - name: Full repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect complete checkout and preserve transform
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          git sparse-checkout list || true
          find customer-dashboard/shared -maxdepth 1 -type f | sort
          find scripts -maxdepth 1 -type f | sort
          test -s .github/scripts/apply-final-customer-baseline.py
          python -m py_compile .github/scripts/apply-final-customer-baseline.py
          cp .github/scripts/apply-final-customer-baseline.py /tmp/apply-final-customer-baseline.py
          python -m py_compile /tmp/apply-final-customer-baseline.py

      - name: Verify remote baseline and PR 803
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          remote_main="$(git rev-parse origin/main)"
          remote_target="$(git rev-parse origin/$TARGET_BRANCH)"
          echo "REMOTE_MAIN=$remote_main"
          echo "REMOTE_TARGET=$remote_target"
          test "$remote_main" = "$BASE_SHA"
          test "$remote_target" = "$BASE_SHA"
          pr="$(gh api repos/${GITHUB_REPOSITORY}/pulls/803)"
          test "$(jq -r .head.sha <<<"$pr")" = "472c3a93ef1883d52ac452c436bbe5ab56b21094"
          test "$(jq -r .state <<<"$pr")" = "open"
          test "$(jq -r .draft <<<"$pr")" = "true"
          test "$(jq -r .merged <<<"$pr")" = "false"
          test "$(jq -r .mergeable <<<"$pr")" = "true"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pulls/803/files --paginate | jq -s 'add|length')" = "2"

      - name: Materialize target baseline and verify completeness
        run: |
          set -euo pipefail
          git switch -C "$TARGET_BRANCH" "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git clean -ffd
          git sparse-checkout disable 2>/dev/null || true
          git checkout "$BASE_SHA" -- .
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --short)"
          required_files=(
            customer-dashboard/shared/customer-assistant-status.css
            customer-dashboard/shared/customer-settings-components.css
            customer-dashboard/shared/customer-support-components.css
            customer-dashboard/shared/customer-runtime-calendar-settings.js
            customer-dashboard/shared/customer-runtime-design-foundation.js
            customer-dashboard/shared/customer-design-system.css
            customer-dashboard/shared/customer-assistant-components.css
            customer-dashboard/shared/customer-navigation-components.css
            customer-dashboard/shared/offer-brand.js
            customer-dashboard/index.html
            scripts/verify-customer-design-foundation.mjs
            scripts/audit-customer-runtime-reachability.mjs
            scripts/verify-p0-security-foundation.mjs
            scripts/verify-customer-navigation-unified.mjs
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "MISSING_REQUIRED_FILE=$file"; exit 1; }
            echo "PRESENT=$file"
          done
          test "$(git hash-object customer-dashboard/shared/customer-assistant-status.css)" = "cd1967881716a41d9a586de889306e1766cc9620"
          test "$(git hash-object customer-dashboard/shared/customer-settings-components.css)" = "c036e4f1dadfb520ad5a1a21a7636695ca86b55d"
          test "$(git hash-object customer-dashboard/shared/customer-support-components.css)" = "17f38fb6ef66f613205a10646f246318559305a4"
          test "$(git hash-object customer-dashboard/shared/customer-runtime-calendar-settings.js)" = "7bf7933cc7981949edf31403e59b76ad6f51f358"

      - name: Apply validated eight-file transform
        run: |
          set -euo pipefail
          python /tmp/apply-final-customer-baseline.py
          git status --short
          git diff --name-status
          git diff --stat

      - name: Verify exact source scope and structure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          expected_paths = sorted([
              "customer-dashboard/index.html",
              "customer-dashboard/shared/customer-assistant-components.css",
              "customer-dashboard/shared/customer-design-system.css",
              "customer-dashboard/shared/customer-navigation-components.css",
              "customer-dashboard/shared/customer-runtime-design-foundation.js",
              "customer-dashboard/shared/customer-runtime-notifications-design.js",
              "customer-dashboard/shared/offer-brand.js",
              "scripts/verify-customer-design-foundation.mjs",
          ])
          changed = sorted(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed == expected_paths, (changed, expected_paths)
          assert not any(path.startswith(".github/") for path in changed)
          assert subprocess.call(["git", "diff", "--quiet", "--", "customer-dashboard/shared/customer-runtime-calendar-settings.js"]) == 0
          expected_css = [
              ("customer-dashboard/shared/customer-design-system.css", 498, 499),
              ("customer-dashboard/shared/customer-assistant-components.css", 967, 968),
              ("customer-dashboard/shared/customer-navigation-components.css", 120, 121),
          ]
          for path, content_lines, line_count in expected_css:
              text = Path(path).read_text(encoding="utf-8")
              assert len(text.splitlines()) == content_lines, path
              assert len(re.split(r"\r?\n", text)) == line_count, path
              assert text.endswith("\n") and not text.endswith("\n\n"), path
              assert text.count("{") == text.count("}"), path
          dashboard = Path("customer-dashboard/index.html").read_text(encoding="utf-8")
          assert len(re.findall(r"<style\b", dashboard, re.I)) == 48
          assert len(re.findall(r"</style\s*>", dashboard, re.I)) == 48
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', dashboard, re.I)
          assert len(blocks) == 33, len(blocks)
          for index, block in enumerate(blocks):
              path = Path("/tmp") / f"inline-{index}.js"
              path.write_text(block, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print("INLINE_SCRIPT_CHECKS=33/33")
          PY
          test ! -e customer-dashboard/shared/customer-runtime-notifications-design.js
          node --check customer-dashboard/shared/offer-brand.js
          node --check customer-dashboard/shared/customer-runtime-design-foundation.js

      - name: Verify cache chain
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          dashboard = Path("customer-dashboard/index.html").read_text(encoding="utf-8")
          loader = Path("customer-dashboard/shared/offer-brand.js").read_text(encoding="utf-8")
          runtime = Path("customer-dashboard/shared/customer-runtime-design-foundation.js").read_text(encoding="utf-8")
          assert '/shared/offer-brand.js?v=20260805-1' in dashboard
          assert '/shared/offer-brand.js"></script>' not in dashboard
          assert '/shared/customer-runtime-design-foundation.js?v=20260805-1' in loader
          order = [
              '/shared/customer-design-system.css?v=20260805-1',
              '/shared/customer-assistant-components.css?v=20260805-1',
              '/shared/customer-assistant-status.css?v=20260803-1',
              '/shared/customer-navigation-components.css?v=20260805-1',
              '/shared/customer-settings-components.css?v=20260803-2',
              '/shared/customer-support-components.css?v=20260802-2',
          ]
          positions = [runtime.index(token) for token in order]
          assert positions == sorted(positions), positions
          for stale in [
              '/shared/customer-design-system.css?v=20260804-1',
              '/shared/customer-assistant-components.css?v=20260803-1',
              '/shared/customer-navigation-components.css?v=20260803-1',
          ]:
              assert stale not in runtime, stale
          print("CACHE_CHAIN=PASS")
          PY

      - name: Run design foundation verifier
        run: |
          set -euo pipefail
          echo 'node scripts/verify-customer-design-foundation.mjs'
          node scripts/verify-customer-design-foundation.mjs

      - name: Run runtime reachability audit
        run: |
          set -euo pipefail
          echo 'node scripts/audit-customer-runtime-reachability.mjs'
          node scripts/audit-customer-runtime-reachability.mjs

      - name: Run P0 security verifier
        run: |
          set -euo pipefail
          echo 'node scripts/verify-p0-security-foundation.mjs'
          node scripts/verify-p0-security-foundation.mjs

      - name: Run unified navigation verifier
        run: |
          set -euo pipefail
          echo 'node scripts/verify-customer-navigation-unified.mjs'
          node scripts/verify-customer-navigation-unified.mjs

      - name: Run non-fail-fast 292 assertion recheck
        run: |
          set -euo pipefail
          mkdir -p audit-output
          cat >/tmp/assert-collector.mjs <<'JS'
          import fs from 'node:fs';
          const results=[];
          function record(ok,message,method){
            results.push({index:results.length+1,result:ok?'PASS':'FAIL',reason:String(message||method),method});
            return ok;
          }
          const assert={
            ok(v,m){return record(Boolean(v),m,'ok')},
            equal(a,b,m){return record(Object.is(a,b),m,'equal')},
            strictEqual(a,b,m){return record(Object.is(a,b),m,'strictEqual')},
            deepEqual(a,b,m){return record(JSON.stringify(a)===JSON.stringify(b),m,'deepEqual')},
            match(a,r,m){return record(r.test(String(a)),m||`value missing regex: ${r}`,'match')},
            doesNotMatch(a,r,m){return record(!r.test(String(a)),m||`value matches forbidden regex: ${r}`,'doesNotMatch')},
            fail(m){return record(false,m,'fail')}
          };
          process.on('beforeExit',()=>{
            const summary={total:results.length,pass:results.filter(x=>x.result==='PASS').length,fail:results.filter(x=>x.result==='FAIL').length};
            fs.writeFileSync('audit-output/assertions.json',JSON.stringify(results,null,2));
            fs.writeFileSync('audit-output/summary.json',JSON.stringify(summary,null,2));
          });
          export default assert;
          JS
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/verify-customer-design-foundation.mjs").read_text(encoding="utf-8")
          old = "import assert from 'node:assert/strict';"
          assert source.count(old) == 1
          source = source.replace(old, "import assert from 'file:///tmp/assert-collector.mjs';", 1)
          Path("/tmp/verify-customer-design-foundation-audit.mjs").write_text(source, encoding="utf-8")
          PY
          node /tmp/verify-customer-design-foundation-audit.mjs
          node - <<'JS'
          const summary=require('./audit-output/summary.json');
          console.log(summary);
          if(summary.total!==292||summary.pass!==292||summary.fail!==0) throw new Error(JSON.stringify(summary));
          JS

      - name: Commit and push exactly eight source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$BASE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            customer-dashboard/index.html \
            customer-dashboard/shared/customer-assistant-components.css \
            customer-dashboard/shared/customer-design-system.css \
            customer-dashboard/shared/customer-navigation-components.css \
            customer-dashboard/shared/customer-runtime-design-foundation.js \
            customer-dashboard/shared/customer-runtime-notifications-design.js \
            customer-dashboard/shared/offer-brand.js \
            scripts/verify-customer-design-foundation.mjs
          git diff --cached --name-status
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "chore: restore mandatory customer launch checks"
          git push origin HEAD:refs/heads/codex/restore-customer-launch-checks
          mkdir -p audit-output
          git rev-parse HEAD | tee audit-output/source-head-sha.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-customer-baseline-evidence
          path: audit-output
          if-no-files-found: ignore
          retention-days: 7
