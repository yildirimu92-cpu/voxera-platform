name: Verify Customer Voice Preview Fallback

on:
  pull_request:
    paths:
      - 'customer-dashboard/netlify/functions/preview-voice.js'
      - 'customer-dashboard/shared/customer-runtime-voice-preview-fallback.js'
      - 'customer-dashboard/shared/customer-runtime-assistant-business-menu.js'
      - 'scripts/verify-customer-voice-preview-fallback.mjs'
      - '.github/workflows/verify-customer-voice-preview-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/netlify/functions/preview-voice.js'
      - 'customer-dashboard/shared/customer-runtime-voice-preview-fallback.js'
      - 'customer-dashboard/shared/customer-runtime-assistant-business-menu.js'
      - 'scripts/verify-customer-voice-preview-fallback.mjs'
      - '.github/workflows/verify-customer-voice-preview-fallback.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-customer-voice-preview-fallback.mjs
