name: Verify Anfragen List Row Polish

on:
  pull_request:
    paths:
      - 'customer-dashboard/index.html'
      - 'scripts/verify-anfragen-list-row-polish.mjs'
      - '.github/workflows/verify-anfragen-list-row-polish.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/index.html'
      - 'scripts/verify-anfragen-list-row-polish.mjs'
      - '.github/workflows/verify-anfragen-list-row-polish.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-anfragen-list-row-polish.mjs
