name: Temporary Notification Save Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-settings-commercial.yml'
      - 'scripts/tmp-settings-commercial-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print exact notification functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for fn in ['vxInitBenachrichtigungen', 'vxSaveBenachrichtigungen']:
            match = re.search(r'(?:async\s+)?function\s+' + re.escape(fn) + r'\s*\(', text)
            print('===', fn, '===')
            if not match:
              print('NOT FOUND')
              continue
            start = text[:match.start()].count('\n')
            depth = 0
            opened = False
            for i in range(start, min(len(lines), start + 500)):
              line = lines[i]
              print(f'{i+1}: {line}')
              for ch in line:
                if ch == '{': depth += 1; opened = True
                elif ch == '}': depth -= 1
              if opened and depth == 0:
                break
          PY
