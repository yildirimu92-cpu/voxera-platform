name: Temporary Profile Notification Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-settings-commercial.yml'
      - 'scripts/tmp-settings-commercial-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print profile and notification contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for start, end, label in [
            (7315, 7520, 'profile and notification markup'),
            (14620, 15120, 'profile and notification runtime')
          ]:
            print(f'=== {label}: {start}-{end} ===')
            for i in range(start - 1, min(end, len(lines))):
              print(f'{i+1}: {lines[i]}')
          PY
