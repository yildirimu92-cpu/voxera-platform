name: Temporary Subscription Block Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-settings-commercial.yml'
      - 'scripts/tmp-settings-commercial-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print subscription block and related function names
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for start, end, label in [
            (7500, 7810, 'subscription markup'),
            (15220, 15640, 'subscription runtime'),
            (16980, 17230, 'legacy commercial runtime')
          ]:
            print(f'=== {label}: {start}-{end} ===')
            for i in range(start - 1, min(end, len(lines))):
              print(f'{i+1}: {lines[i]}')
          PY
