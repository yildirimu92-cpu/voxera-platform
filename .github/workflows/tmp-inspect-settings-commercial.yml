name: Temporary Settings Boundary Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-settings-commercial.yml'
      - 'scripts/tmp-settings-commercial-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print exact help and modal boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()
          for start, end, label in [
            (7805, 8245, 'help tab and first commercial modal'),
            (8100, 8300, 'commercial modal markup'),
            (8625, 8705, 'duplicate sheet commercial modals')
          ]:
            print(f'=== {label}: {start}-{end} ===')
            for i in range(start - 1, min(end, len(lines))):
              print(f'{i+1}: {lines[i]}')

          print('=== STRUCTURAL COMMENTS ===')
          for i, line in enumerate(lines):
            if 7780 <= i + 1 <= 8720 and '<!--' in line:
              print(f'{i+1}: {line}')
          PY
