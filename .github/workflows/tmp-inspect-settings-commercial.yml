name: Temporary Settings Markup Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-settings-commercial.yml'
      - 'scripts/tmp-settings-commercial-trigger.txt'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print exact settings ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = text.splitlines()

          ranges = [
            (7320, 7570, 'profile notifications subscription markup'),
            (7700, 7820, 'legacy settings duplicate'),
            (8240, 8420, 'help page markup'),
            (14500, 15720, 'settings runtime and commercial functions'),
            (16650, 17210, 'legacy commercial modals and functions')
          ]
          for start, end, label in ranges:
            print(f'=== {label}: {start}-{end} ===')
            for i in range(start - 1, min(end, len(lines))):
              print(f'{i+1}: {lines[i]}')

          print('=== OVERLAY IDS ===')
          for i, line in enumerate(lines):
            if any(token in line for token in ['upgrade-overlay', 'minutes-overlay', 'vx-upgrade-overlay', 'vx-minutes-overlay']):
              print(f'{i+1}: {line}')
          PY
