name: Verify Call Intake

on:
  pull_request:
    paths:
      - 'customer-dashboard/netlify/functions/_lib/phone-normalize.js'
      - 'customer-dashboard/netlify/functions/elevenlabs-post-call.js'
      # Bewusst weiter als Ausloeser gelistet, obwohl beide Dateien geloescht
      # sind: nur so laeuft der Waechter an, wenn jemand sie zurueckbringt.
      - 'customer-dashboard/netlify/functions/call-intake-resolve-customer.js'
      - 'customer-dashboard/tests/call-intake-resolver-contract.test.cjs'
      - 'customer-dashboard/tests/phone-normalize.test.cjs'
      - 'customer-dashboard/tests/postcall-lifecycle-no-downgrade.test.cjs'
      - 'supabase/sql/2026-08-01_call_intake_idempotency.sql'
      - '.github/workflows/verify-call-intake.yml'
  push:
    branches:
      - main
    paths:
      - 'customer-dashboard/netlify/functions/_lib/phone-normalize.js'
      - 'customer-dashboard/netlify/functions/elevenlabs-post-call.js'
      # Bewusst weiter als Ausloeser gelistet, obwohl beide Dateien geloescht
      # sind: nur so laeuft der Waechter an, wenn jemand sie zurueckbringt.
      - 'customer-dashboard/netlify/functions/call-intake-resolve-customer.js'
      - 'customer-dashboard/tests/call-intake-resolver-contract.test.cjs'
      - 'customer-dashboard/tests/phone-normalize.test.cjs'
      - 'customer-dashboard/tests/postcall-lifecycle-no-downgrade.test.cjs'
      - 'supabase/sql/2026-08-01_call_intake_idempotency.sql'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check call intake function syntax
        run: |
          node --check customer-dashboard/netlify/functions/_lib/phone-normalize.js
          node --check customer-dashboard/netlify/functions/elevenlabs-post-call.js
      - name: Run call intake tests
        run: |
          node --test customer-dashboard/tests/phone-normalize.test.cjs
          node --test customer-dashboard/tests/postcall-lifecycle-no-downgrade.test.cjs
      # Der Resolver-Sicherheitsvertrag stand hier, solange Make-Szenario 01 den
      # Endpunkt aufrief. Der Endpunkt ist am 09.08.2026 entfallen; die
      # Kundenaufloesung laeuft in-process in _lib/call-notification.js. Statt
      # den Vertrag eines geloeschten Endpunkts zu pruefen, wird jetzt geprueft,
      # dass er nicht zurueckkommt.
      - name: Verify the retired resolver stays retired
        shell: bash
        run: |
          test ! -e customer-dashboard/netlify/functions/call-intake-resolve-customer.js
          test ! -e customer-dashboard/tests/call-intake-resolver-contract.test.cjs
          ! grep -rn "CALL_INTAKE_RESOLVER_SECRET" customer-dashboard/netlify/functions/
      - name: Verify call intake migration invariants
        shell: bash
        run: |
          grep -q "uq_calls_elevenlabs_conversation_id" supabase/sql/2026-08-01_call_intake_idempotency.sql
          grep -q "idx_calls_phone_pair_created_at" supabase/sql/2026-08-01_call_intake_idempotency.sql
          grep -q "WHERE elevenlabs_conversation_id IS NOT NULL" supabase/sql/2026-08-01_call_intake_idempotency.sql
