name: Inspect Customer Navigation

on:
  push:
    branches:
      - codex/customer-navigation-five-root
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - '.github/workflows/tmp-inspect-navigation.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact navigation owners
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          needles = [
              'id="nav-archiv"',
              'id="mnav-archiv"',
              'id="nav-assistent"',
              'id="mnav-assistent"',
              'id="mnav-auswertung"',
              'onclick="showTab(\'auswertung\')"',
              'data-filter="done"',
              '.mobile-nav-inner{',
              '.mobile-nav-btn{'
          ]

          for needle in needles:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(matches)} =====')
              for i in matches[:5]:
                  start = max(0, i - 3)
                  end = min(len(lines), i + 7)
                  for n in range(start, end):
                      print(f'{n + 1}: {lines[n]}')
          PY
