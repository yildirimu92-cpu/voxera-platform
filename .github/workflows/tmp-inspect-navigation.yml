name: Inspect Customer Navigation

on:
  push:
    branches:
      - codex/customer-navigation-five-root
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - '.github/workflows/tmp-inspect-navigation.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect request header and mobile settings button
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          for title, start, end in [
              ('requests header', 6795, 6845),
              ('mobile settings', 8178, 8192),
          ]:
              print(f'\n===== {title} =====')
              for n in range(start - 1, min(end, len(lines))):
                  print(f'{n + 1}: {lines[n]}')
          PY
