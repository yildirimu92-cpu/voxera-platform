name: Apply Customer Navigation Migration

on:
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - 'scripts/tmp_migrate_customer_navigation.py'
      - '.github/workflows/tmp-inspect-navigation.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply structural navigation migration
        run: python scripts/tmp_migrate_customer_navigation.py
      - name: Verify existing customer foundations
        run: |
          node --check customer-dashboard/shared/customer-runtime-unified-navigation.js
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/audit-customer-design-ownership.mjs
      - name: Commit product migration
        run: |
          changed="$(git diff --name-only)"
          expected=$'customer-dashboard/index.html\ncustomer-dashboard/shared/customer-runtime-unified-navigation.js'
          if [ -z "$changed" ]; then
            echo "Navigation migration already committed."
            exit 0
          fi
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-runtime-unified-navigation.js
          git commit -m "refactor: delete legacy navigation roots"
          git push origin HEAD:codex/customer-navigation-five-root
