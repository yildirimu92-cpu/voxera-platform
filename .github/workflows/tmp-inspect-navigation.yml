name: Apply Navigation Compatibility Cleanup

on:
  pull_request:
    paths:
      - 'customer-dashboard/shared/customer-runtime-unified-navigation.js'
      - 'scripts/tmp_add_navigation_compat_cleanup.py'
      - '.github/workflows/tmp-inspect-navigation.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply compatibility cleanup
        run: python scripts/tmp_add_navigation_compat_cleanup.py
      - name: Verify customer navigation and foundations
        run: |
          node --check customer-dashboard/shared/customer-runtime-unified-navigation.js
          node scripts/verify-customer-navigation-unified.mjs
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/audit-customer-design-ownership.mjs
      - name: Commit runtime correction
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Compatibility cleanup already committed."
            exit 0
          fi
          test "$changed" = "customer-dashboard/shared/customer-runtime-unified-navigation.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/shared/customer-runtime-unified-navigation.js
          git commit -m "fix: delete stale archive root nodes"
          git push origin HEAD:codex/customer-navigation-five-root
