name: Inspect Customer Navigation

on:
  push:
    branches:
      - codex/customer-navigation-five-root
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - '.github/workflows/tmp-inspect-navigation.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect navigation markup and insertion points
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()

          def show(start, end, title):
              print(f'\n===== {title}: lines {start}-{end} =====')
              for n in range(start - 1, min(end, len(lines))):
                  print(f'{n + 1}: {lines[n]}')

          show(6570, 6725, 'desktop navigation and requests start')
          show(7300, 7360, 'settings list')
          show(8140, 8200, 'mobile navigation')
          show(5585, 5625, 'mobile nav force-show CSS')

          for needle in ['function showTab', '<div class="tab-page" id="tab-anrufe"', 'id="anrufe-split"']:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(matches)} match(es) =====')
              for i in matches[:5]:
                  show(max(1, i - 20), min(len(lines), i + 50), needle)
          PY
