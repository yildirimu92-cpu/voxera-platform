name: Inspect Customer Navigation

on:
  push:
    branches:
      - codex/customer-navigation-five-root
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - '.github/workflows/tmp-inspect-navigation.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect mobile navigation layout ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          needles = [
              '.mobile-nav-inner', '.mobile-nav-btn', '.mobile-nav {',
              'grid-template-columns', 'justify-content:space-around',
              'justify-content: space-around', 'safe-area-inset-bottom'
          ]

          shown = set()
          for needle in needles:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'\n===== {needle}: {len(matches)} match(es) =====')
              for i in matches:
                  start = max(0, i - 8)
                  end = min(len(lines), i + 18)
                  key = (start, end)
                  if key in shown:
                      continue
                  shown.add(key)
                  print(f'--- lines {start + 1}-{end} ---')
                  for n in range(start, end):
                      print(f'{n + 1}: {lines[n]}')
          PY
