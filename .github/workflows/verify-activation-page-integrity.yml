name: Verify Activation Page Integrity

# customer-dashboard/activate.html war ueber 20 Commits hinweg abgeschnitten und
# damit vollstaendig funktionslos, ohne dass das im Browser eine Spur hinterliess.
# Ursache war wiederholtes Herunterladen und Wiederhochladen der Datei.
# Seit 09.08.2026 prueft der Check zusaetzlich den Weg ZUR Seite: der
# Aktivierungslink zeigte auf die Dashboard-Wurzel, nicht auf /activate — die
# Seite konnte deshalb kaputt sein, ohne dass ein Kunde je darueber stolperte.
# Reiner Datei-Check ohne Netzwerk- oder Datenbankzugriff.

on:
  pull_request:
    paths:
      - 'customer-dashboard/activate.html'
      - 'customer-dashboard/index.html'
      - 'customer-dashboard/netlify.toml'
      - 'customer-dashboard/_redirects'
      - 'admin-panel/netlify/functions/send-customer-access.js'
      - 'admin-panel/netlify/functions/outbox-retry-worker.js'
      - 'admin-panel/netlify/functions/_lib/activation-url.js'
      - 'scripts/verify-activation-page-integrity.mjs'
      - '.github/workflows/verify-activation-page-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/activate.html'
      - 'customer-dashboard/index.html'
      - 'customer-dashboard/netlify.toml'
      - 'customer-dashboard/_redirects'
      - 'admin-panel/netlify/functions/send-customer-access.js'
      - 'admin-panel/netlify/functions/outbox-retry-worker.js'
      - 'admin-panel/netlify/functions/_lib/activation-url.js'
      - 'scripts/verify-activation-page-integrity.mjs'
      - '.github/workflows/verify-activation-page-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-activation-page-integrity.mjs
