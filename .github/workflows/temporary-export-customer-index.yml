name: Temporary migrate customer settings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply migrations
        run: |
          node scripts/temporary-migrate-settings-subscription.mjs
          node scripts/temporary-migrate-calendar-settings-entry.mjs
      - name: Commit generated dashboard source
        run: |
          if git diff --quiet -- customer-dashboard/index.html customer-dashboard/shared/customer-runtime-calendar-settings.js; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-runtime-calendar-settings.js
          git commit -m "Migrate settings and subscription ownership"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
