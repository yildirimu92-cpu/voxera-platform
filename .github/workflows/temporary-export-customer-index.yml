name: Temporary migrate customer settings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply migrations
        run: |
          node scripts/temporary-migrate-settings-subscription.mjs
          node scripts/temporary-migrate-calendar-settings-entry.mjs
          node scripts/temporary-write-settings-components.mjs
          node scripts/temporary-update-settings-verifiers.mjs || true
      - name: Commit generated customer settings
        run: |
          if git diff --quiet -- customer-dashboard/index.html customer-dashboard/shared/customer-runtime-calendar-settings.js customer-dashboard/shared/customer-settings-components.css customer-dashboard/shared/customer-runtime-design-foundation.js customer-dashboard/shared/offer-brand.js scripts/verify-calendar-integrations.mjs scripts/verify-customer-design-foundation.mjs scripts/verify-customer-navigation-unified.mjs; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-runtime-calendar-settings.js customer-dashboard/shared/customer-settings-components.css customer-dashboard/shared/customer-runtime-design-foundation.js customer-dashboard/shared/offer-brand.js scripts/verify-calendar-integrations.mjs scripts/verify-customer-design-foundation.mjs scripts/verify-customer-navigation-unified.mjs
          git commit -m "Consolidate settings and subscription verification"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
