name: Codex Browser Access Evidence PR 804

on:
  push:
    branches:
      - codex/tmp-complete-customer-baseline-20260806
    paths:
      - .github/workflows/codex-browser-access-evidence-pr804.yml

permissions:
  contents: read
  statuses: read

jobs:
  browser-access-evidence:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD: 809839882ffc4dea9484ed8197b603bce9590a2a
      PREVIEW_URL: https://deploy-preview-804--voxera-dashboard.netlify.app
    steps:
      - name: Verify exact deploy preview binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p browser-access-output
          status="$(gh api repos/${GITHUB_REPOSITORY}/commits/${SOURCE_HEAD}/status)"
          jq -e --arg url "$PREVIEW_URL" '
            .sha == env.SOURCE_HEAD and
            any(.statuses[];
              .context == "netlify/voxera-dashboard/deploy-preview" and
              .state == "success" and
              .description == "Deploy Preview ready!" and
              .target_url == $url
            )
          ' <<<"$status"
          jq '{sha,state,statuses:[.statuses[]|{context,state,description,target_url}]}' <<<"$status" > browser-access-output/netlify-status.json

      - name: Capture HTTP access response
        run: |
          set -euo pipefail
          curl --location --silent --show-error \
            --dump-header browser-access-output/response-headers.txt \
            --output browser-access-output/response-body.html \
            --write-out '%{json}\n' \
            "$PREVIEW_URL" | tee browser-access-output/http.json
          code="$(jq -r .http_code browser-access-output/http.json)"
          test "$code" = "401"
          test "$(jq -r .url_effective browser-access-output/http.json)" = "$PREVIEW_URL/"

      - name: Install browser driver
        run: |
          set -euo pipefail
          google-chrome --version
          mkdir -p /tmp/browser-access
          cd /tmp/browser-access
          npm init -y >/dev/null
          npm install --silent puppeteer-core@24

      - name: Capture four protected-preview viewports
        run: |
          set -euo pipefail
          cat >/tmp/browser-access/capture.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const previewUrl = process.env.PREVIEW_URL;
          const sourceHead = process.env.SOURCE_HEAD;
          const outputDir = `${process.cwd()}/browser-access-output`;
          fs.mkdirSync(outputDir, { recursive: true });
          const viewports = [
            { name: 'desktop-1440x900', width: 1440, height: 900, mobile: false },
            { name: 'mobile-390x844', width: 390, height: 844, mobile: true },
            { name: 'mobile-375x812', width: 375, height: 812, mobile: true },
            { name: 'mobile-320x568', width: 320, height: 568, mobile: true },
          ];

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
          });
          const results = [];
          try {
            for (const viewport of viewports) {
              const page = await browser.newPage();
              await page.setViewport({
                width: viewport.width,
                height: viewport.height,
                deviceScaleFactor: 1,
                isMobile: viewport.mobile,
                hasTouch: viewport.mobile,
              });
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', error => pageErrors.push(String(error)));
              const response = await page.goto(previewUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await new Promise(resolve => setTimeout(resolve, 1500));
              const diagnostics = await page.evaluate(() => ({
                title: document.title,
                url: location.href,
                readyState: document.readyState,
                innerWidth,
                innerHeight,
                htmlScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body?.scrollWidth || 0,
                bodyText: String(document.body?.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 1000),
                htmlSample: String(document.documentElement?.outerHTML || '').slice(0, 2000),
              }));
              const screenshot = `${outputDir}/${viewport.name}-access-block.png`;
              await page.screenshot({ path: screenshot, fullPage: false });
              results.push({
                sourceHead,
                previewUrl,
                viewport,
                responseStatus: response?.status() || 0,
                responseUrl: response?.url() || '',
                accessBlocked: response?.status() === 401,
                diagnostics,
                consoleErrors,
                pageErrors,
                screenshot: `${viewport.name}-access-block.png`,
              });
              await page.close();
            }
          } finally {
            await browser.close();
          }

          const summary = {
            sourceHead,
            previewUrl,
            status: 'blocked_by_netlify_preview_access_protection',
            totalViewports: results.length,
            blockedViewports: results.filter(result => result.accessBlocked).length,
            results,
          };
          fs.writeFileSync(`${outputDir}/browser-access-report.json`, JSON.stringify(summary, null, 2));
          console.log(JSON.stringify({ status: summary.status, totalViewports: summary.totalViewports, blockedViewports: summary.blockedViewports }, null, 2));
          if (summary.totalViewports !== 4 || summary.blockedViewports !== 4) process.exit(1);
          JS
          cd "$GITHUB_WORKSPACE"
          node /tmp/browser-access/capture.mjs

      - name: Verify evidence files
        run: |
          set -euo pipefail
          test -s browser-access-output/browser-access-report.json
          for image in \
            browser-access-output/desktop-1440x900-access-block.png \
            browser-access-output/mobile-390x844-access-block.png \
            browser-access-output/mobile-375x812-access-block.png \
            browser-access-output/mobile-320x568-access-block.png; do
            test -s "$image"
            file "$image"
          done

      - name: Upload protected-preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr804-protected-preview-browser-evidence
          path: browser-access-output
          if-no-files-found: error
          retention-days: 14
