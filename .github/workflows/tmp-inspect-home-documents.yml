name: Temporary Inspect Home Documents

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-home-documents.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Print subscription runtime and reusable owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index=Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines=index.splitlines()

          def context(term, before=12, after=40, limit=5):
              matches=[i for i,l in enumerate(lines) if term.lower() in l.lower()][:limit]
              print(f'\n## {term} matches={len(matches)}')
              for i in matches:
                  lo=max(0,i-before); hi=min(len(lines),i+after+1)
                  print(f'-- {lo+1}-{hi} --')
                  for n in range(lo,hi): print(f'{n+1}: {lines[n]}')

          for term in [
              'function vxMehrOpenSub',
              'function vxRenderAbo',
              'function vxRenderCancellationAction',
              'function vxSubmitReactivationRequest',
              'customerContractMeta =',
              'customerContractState =',
              'loadCustomerContract',
              "auth.getSession()",
              "Authorization: `Bearer",
              'abo-invoices-list'
          ]:
              context(term)

          css=Path('customer-dashboard/shared/customer-settings-components.css').read_text(encoding='utf-8')
          print('\n## CSS REUSABLE SELECTORS')
          for selector in ['.vx-commercial-entry', '.vx-settings-card-body', '.vx-abo-empty', '.vx-settings-list', '.vx-abo-btn']:
              pos=css.find(selector)
              print(selector, 'FOUND' if pos>=0 else 'MISSING')
              if pos>=0: print(css[pos:pos+500])

          print('\n## CONTRACT FIELD OCCURRENCES')
          terms=['signed_pdf_url','contract_pdf_url','contract_public_token','countersigned_at','signature_data']
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or p.suffix.lower() not in {'.js','.sql','.html','.mjs'}: continue
              if any(part in {'.git','node_modules','dist','build'} for part in p.parts): continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              found=[term for term in terms if term in text]
              if found:
                  print(str(p), ','.join(found))
          PY
