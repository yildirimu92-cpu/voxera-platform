name: Temporary Migrate Customer Documents

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-home-documents.yml
      - scripts/tmp_migrate_customer_documents.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded document migration
        run: python scripts/tmp_migrate_customer_documents.py
      - name: Validate customer document endpoint
        run: node --check customer-dashboard/netlify/functions/customer-documents.js
      - name: Verify existing customer contracts
        run: |
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/verify-customer-actions.mjs
          node scripts/verify-p0-security-foundation.mjs
          node scripts/verify-calendar-integrations.mjs
      - name: Verify tenant-bound documents
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          endpoint=Path('customer-dashboard/netlify/functions/customer-documents.js').read_text(encoding='utf-8')
          required_index=[
            'id="abo-contract-documents"',
            'id="abo-invoices-list"',
            'function vxLoadCustomerDocuments',
            "callDashboardFunction('customer-documents'",
            "await vxLoadCustomerDocuments();",
            'Unterzeichneter Vertrag'
          ]
          missing=[token for token in required_index if token not in index]
          if missing: raise SystemExit('missing dashboard document tokens: ' + ', '.join(missing))
          if index.count('id="abo-contract-documents"') != 1: raise SystemExit('contract document owner must exist once')
          if index.count('id="abo-invoices-list"') != 1: raise SystemExit('invoice document owner must exist once')
          if 'Rechnungen werden hier angezeigt, sobald sie verfügbar sind.' in index: raise SystemExit('legacy invoice placeholder remains')
          required_endpoint=[
            "requireActiveContract: false",
            ".from('invoices')",
            ".from('contracts')",
            ".eq('customer_id', guard.customerId)",
            "functionName: 'customer-documents'"
          ]
          missing=[token for token in required_endpoint if token not in endpoint]
          if missing: raise SystemExit('missing endpoint security tokens: ' + ', '.join(missing))
          if endpoint.count(".eq('customer_id', guard.customerId)") != 2: raise SystemExit('both document queries must be tenant-bound')
          PY
          git diff --check
      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "feat: show customer invoices and signed contract"
            git push origin HEAD:codex/customer-settings-commercial-flows
          fi
