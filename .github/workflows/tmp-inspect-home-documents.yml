name: Temporary Inspect Home Documents

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-home-documents.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
      - name: Inspect current customer portal blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('customer-dashboard/index.html')
          lines = p.read_text(encoding='utf-8').splitlines()
          terms = [
            'Aufmerksamkeit', 'Heute passiert', 'Offene Aufgaben', 'Nicht bearbeitet',
            'vx-ap-card', 'Rechnungen', 'Vertrag kündigen', 'contract_document',
            "from('invoices')", 'from("invoices")', "from('contracts')", 'from("contracts")',
            'invoice_number', 'pdf_url', 'signature_data', 'contract_text'
          ]
          hits = []
          for i, line in enumerate(lines, 1):
            if any(term in line for term in terms):
              hits.append(i)
          print('INDEX_LINES', len(lines))
          for i in hits:
            lo=max(1,i-8); hi=min(len(lines),i+14)
            print(f'\n--- INDEX {lo}-{hi} hit {i} ---')
            for n in range(lo,hi+1):
              print(f'{n}: {lines[n-1]}')

          for path in [
            'supabase/sql/2026-04-11_invoice_system_v1.sql',
            'supabase/sql/2026-04-03_add_subscriptions_and_contracts.sql',
            'supabase/sql/2026-04-11_offer_system_v1.sql',
            'admin-panel/netlify/functions/_lib/invoice-service.js'
          ]:
            q=Path(path)
            if not q.exists():
              continue
            qlines=q.read_text(encoding='utf-8').splitlines()
            print(f'\n=== FILE {path} lines={len(qlines)} ===')
            for i,line in enumerate(qlines,1):
              if any(term in line.lower() for term in ['pdf','invoice','contract','signature','document','customer_id']):
                lo=max(1,i-3); hi=min(len(qlines),i+6)
                print(f'--- {lo}-{hi} hit {i} ---')
                for n in range(lo,hi+1): print(f'{n}: {qlines[n-1]}')
          PY
