name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Temporary final dashboard source inspection
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = source.splitlines()

          def show(title, first_line, last_line):
              print(f'\n===== {title} lines {first_line}-{last_line} =====')
              for line_number in range(first_line, min(last_line, len(lines)) + 1):
                  print(f'{line_number:06d}: {lines[line_number - 1]}')

          show('DASHBOARD MARKUP', 7050, 7240)
          show('PRIORITY RENDERER CONTINUATION', 10320, 10540)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
