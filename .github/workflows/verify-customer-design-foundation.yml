name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp-fix-customer-requests-interactions.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore requests interactions
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: node scripts/tmp-fix-customer-requests-interactions.mjs
      - run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
      - name: Verify requests interactions
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          grep -q "requestsClickBound" customer-dashboard/index.html
          grep -q "vxInboxToggleSelected(rowId)" customer-dashboard/index.html
          grep -q "vxOpenFloatingRowMenu(overflowButton, menu)" customer-dashboard/index.html
          grep -q "row.click();" customer-dashboard/index.html
      - name: Commit requests interaction fix
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "fix(customer): preserve requests row interactions"
          git push origin HEAD:${{ github.head_ref }}
