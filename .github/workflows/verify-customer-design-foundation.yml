name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Temporary dashboard source inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          lines = source.splitlines()

          def show(title, start, end):
              print(f'\n===== {title} lines {start + 1}-{end} =====')
              for index in range(start, min(end, len(lines))):
                  print(f'{index + 1:06d}: {lines[index]}')

          marker_index = next(i for i, line in enumerate(lines) if 'DASHBOARD V2 PREMIUM' in line)
          next_marker = next((i for i in range(marker_index + 1, len(lines)) if '/* ──' in lines[i]), marker_index + 700)
          show('DASHBOARD CSS BLOCK', marker_index, next_marker)

          dash_start = next(i for i, line in enumerate(lines) if 'id="tab-dashboard"' in line)
          dash_end = next(i for i in range(dash_start + 1, len(lines)) if 'id="tab-anrufe"' in lines[i])
          show('DASHBOARD MARKUP', dash_start, dash_end)

          assistant_start = next(i for i, line in enumerate(lines) if 'id="tab-assistent"' in line)
          assistant_end = next(i for i in range(assistant_start + 1, len(lines)) if 'class="tab-page"' in lines[i] and 'id="tab-assistent"' not in lines[i])
          show('ASSISTANT TAB HOST MARKUP', assistant_start, assistant_end)

          print('\n===== DASHBOARD SELECTOR INVENTORY =====')
          for index, line in enumerate(lines):
              if re.search(r'\.(?:dash-|vx-jetzt|dpr-|vx-group-|vx-activity)', line):
                  print(f'{index + 1:06d}: {line}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
