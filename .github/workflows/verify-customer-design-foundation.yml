name: Verify Customer Design Foundation

on:
  push:
    branches:
      - codex/customer-settings-commercial-flows
    paths:
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
          fetch-depth: 0
      - name: Diagnose guarded requests split repair
        shell: bash
        run: |
          set +e
          python scripts/tmp_fix_customer_requests_split.py > /tmp/repair.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            cat /tmp/repair.log
          } > scripts/tmp_fix_customer_requests_split.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tmp_fix_customer_requests_split.log
          git commit -m "chore: capture requests split repair diagnostic"
          git push origin HEAD:codex/customer-settings-commercial-flows
