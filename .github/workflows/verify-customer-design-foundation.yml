name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp-inspect-customer-request-filters.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded requests filter state fix
        run: node scripts/tmp-inspect-customer-request-filters.mjs
      - name: Verify customer design foundation
        run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
      - name: Verify requests filter state scope
        run: |
          node scripts/audit-customer-runtime-reachability.mjs
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = ['customer-dashboard/index.html']
          if changed != expected:
              raise SystemExit(f'Unexpected product scope: {changed}')

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          scripts = '\n'.join(__import__('re').findall(r'<script\b[^>]*>[\s\S]*?</script>', source, flags=__import__('re').I))
          old = '#anrufe-split-left .vx-split-filters'
          new = '#anrufe-split-left .vx-requests-filters'
          if old in scripts:
              raise SystemExit('Obsolete requests filter selector remains in JavaScript')
          if scripts.count(new) != 6:
              raise SystemExit(f'Canonical requests selector count mismatch: {scripts.count(new)}')
          if ".closest('.vx-requests-filters')" not in scripts:
              raise SystemExit('Canonical requests closest selector missing')
          print('Requests filter state verification passed.')
          PY
      - name: Commit requests filter state fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "fix(customer): keep one requests filter active"
          git push origin HEAD:${{ github.head_ref }}
