name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp_replace_dashboard_legacy.py'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Replace dashboard legacy presentation
        run: python scripts/tmp_replace_dashboard_legacy.py
      - name: Verify migration diff
        run: |
          git diff --check
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs >/tmp/design-ownership.txt
          grep -q 'id="dash-greeting-block" class="vx-page-header"' customer-dashboard/index.html
          grep -q 'id="dash-kpi-strip" class="vx-ap-grid"' customer-dashboard/index.html
          grep -q 'id="dash-priority-section" class="vx-ops-card"' customer-dashboard/index.html
          grep -q 'id="dash-activity-section" class="vx-ops-card"' customer-dashboard/index.html
      - name: Commit migrated dashboard
        run: |
          if git diff --quiet -- customer-dashboard/index.html; then
            echo "No migration diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "refactor(customer): replace dashboard legacy with assistant design"
          git push origin HEAD:${{ github.head_ref }}
