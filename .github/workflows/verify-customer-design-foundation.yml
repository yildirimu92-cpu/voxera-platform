name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp_replace_dashboard_legacy.py'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Diagnose remaining dashboard legacy presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_replace_dashboard_legacy.py')
          source = path.read_text(encoding='utf-8')
          old = """for token in OBSOLETE_SELECTORS:\n    if token in style_text:\n        raise AssertionError(f'Legacy dashboard selector remains in CSS: {token}')\n"""
          new = """for token in OBSOLETE_SELECTORS:\n    if token in style_text:\n        position = style_text.index(token)\n        context = style_text[max(0, position - 500):position + 700]\n        print(f'REMAINING LEGACY TOKEN: {token}\\n--- CONTEXT START ---\\n{context}\\n--- CONTEXT END ---')\n        raise AssertionError(f'Legacy dashboard selector remains in CSS: {token}')\n"""
          if old not in source:
              raise SystemExit('diagnostic assertion anchor not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/tmp_replace_dashboard_legacy.py
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: '20'
      - name: Verify migration diff
        if: success()
        run: |
          git diff --check
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs >/tmp/design-ownership.txt
      - name: Commit migrated dashboard
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "refactor(customer): replace dashboard legacy with assistant design"
          git push origin HEAD:${{ github.head_ref }}
