name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp-migrate-customer-requests-design.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Narrow protected surface fingerprints
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-migrate-customer-requests-design.mjs')
          text = path.read_text(encoding='utf-8')

          dashboard_entry = "  ['dashboard', hash(windowAround(dashboard, 'id=\"tab-dashboard\"', 200, 9000))],\n"
          if text.count(dashboard_entry) != 1:
              raise SystemExit('dashboard fingerprint entry mismatch')
          text = text.replace(dashboard_entry, '', 1)

          for old, new, label in [
              (
                  "  ['report', hash(windowAround(dashboard, 'id=\"tab-auswertung\"', 200, 12000))],",
                  "  ['report', hash(windowAround(dashboard, 'id=\"tab-auswertung\"', 0, 3000))],",
                  'report fingerprint entry',
              ),
              (
                  "  ['settings', hash(windowAround(dashboard, 'id=\"tab-mehr\"', 200, 10000))]",
                  "  ['settings', hash(windowAround(dashboard, 'id=\"tab-mehr\"', 0, 3000))]",
                  'settings fingerprint entry',
              ),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} mismatch')
              text = text.replace(old, new, 1)

          anchor = "]);\n\nconst protectedFunctions"
          addition = "]);\n\nconst dashboardSurfaceStart = dashboard.indexOf('id=\"tab-dashboard\"');\nconst dashboardSurfaceEnd = dashboard.indexOf('        <!-- ANFRAGEN TAB -->', dashboardSurfaceStart);\nassert.ok(dashboardSurfaceStart >= 0 && dashboardSurfaceEnd > dashboardSurfaceStart, 'dashboard surface bounds missing');\nconst protectedDashboardSurfaceHash = hash(dashboard.slice(dashboardSurfaceStart, dashboardSurfaceEnd));\n\nconst protectedFunctions"
          if text.count(anchor) != 1:
              raise SystemExit('protected function anchor mismatch')
          text = text.replace(anchor, addition, 1)

          verify_anchor = "for (const [name, expectedHash] of protectedWindows) {"
          verification = "const migratedDashboardSurfaceStart = dashboard.indexOf('id=\"tab-dashboard\"');\nconst migratedDashboardSurfaceEnd = dashboard.indexOf('        <!-- ANFRAGEN TAB -->', migratedDashboardSurfaceStart);\nassert.ok(migratedDashboardSurfaceStart >= 0 && migratedDashboardSurfaceEnd > migratedDashboardSurfaceStart, 'migrated dashboard surface bounds missing');\nassert.equal(\n  hash(dashboard.slice(migratedDashboardSurfaceStart, migratedDashboardSurfaceEnd)),\n  protectedDashboardSurfaceHash,\n  'protected surface changed: dashboard'\n);\n\nfor (const [name, expectedHash] of protectedWindows) {"
          if text.count(verify_anchor) != 1:
              raise SystemExit('protected window verification anchor mismatch')
          text = text.replace(verify_anchor, verification, 1)

          old_bounds = "  const before = name === 'loading' ? 2200 : 200;\n  const after = name === 'loading' ? 6200 : name === 'report' ? 12000 : name === 'settings' ? 10000 : 9000;"
          new_bounds = "  const before = name === 'loading' ? 2200 : 0;\n  const after = name === 'loading' ? 6200 : 3000;"
          if text.count(old_bounds) != 1:
              raise SystemExit('protected window bounds mismatch')
          text = text.replace(old_bounds, new_bounds, 1)

          old_forbidden = "  'dpr-command-center',\n  'class=\"dpr-card',"
          new_forbidden = "  'class=\"dpr-command-center',\n  'class=\"dpr-card',"
          if text.count(old_forbidden) != 1:
              raise SystemExit('legacy renderer assertion mismatch')
          text = text.replace(old_forbidden, new_forbidden, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply guarded requests migration
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: node scripts/tmp-migrate-customer-requests-design.mjs
      - name: Compact requests component block
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('customer-dashboard/shared/customer-assistant-components.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Customer requests: assistant-aligned canonical component owner. */'
          if text.count(marker) != 1:
              raise SystemExit('requests component marker mismatch')
          prefix, block = text.split(marker, 1)
          block = marker + block
          block = re.sub(r'\s+', ' ', block).strip()
          block = re.sub(r'\s*([{}:;,])\s*', r'\1', block)
          block = block.replace('}', '}\n').strip()
          path.write_text(prefix.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY
          git checkout -- scripts/tmp-migrate-customer-requests-design.mjs
      - run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
      - name: Verify requests migration scope
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          node scripts/audit-customer-runtime-reachability.mjs
          mapfile -t changed_files < <(git diff --name-only | sort)
          printf 'Changed product files:\n'
          printf ' - %s\n' "${changed_files[@]}"
          test "${#changed_files[@]}" -eq 2
          test "${changed_files[0]}" = "customer-dashboard/index.html"
          test "${changed_files[1]}" = "customer-dashboard/shared/customer-assistant-components.css"
          grep -q 'class="vx-requests-layout"' customer-dashboard/index.html
          grep -q 'vx-requests-item' customer-dashboard/index.html
          grep -q 'Customer requests: assistant-aligned canonical component owner.' customer-dashboard/shared/customer-assistant-components.css
          ! grep -q '!important' customer-dashboard/shared/customer-assistant-components.css
      - name: Commit requests migration
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/customer-requests-assistant-design'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css
          git commit -m "refactor(customer): migrate requests to assistant design"
          git push origin HEAD:${{ github.head_ref }}
