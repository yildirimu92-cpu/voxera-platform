name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches:
      - main
      - codex/customer-settings-commercial-flows
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp_fix_customer_requests_split.py'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-settings-commercial-flows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded requests split repair
        run: python scripts/tmp_fix_customer_requests_split.py
      - run: node scripts/verify-customer-design-foundation.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
      - name: Commit source repair and restore workflow
        run: |
          cat > .github/workflows/verify-customer-design-foundation.yml <<'YAML'
          name: Verify Customer Design Foundation

          on:
            pull_request:
              paths:
                - 'customer-dashboard/**/*.css'
                - 'customer-dashboard/**/*.html'
                - 'customer-dashboard/shared/**/*.js'
                - 'scripts/verify-customer-design-foundation.mjs'
                - 'scripts/audit-customer-design-ownership.mjs'
                - '.github/workflows/verify-customer-design-foundation.yml'
            push:
              branches: [main]
              paths:
                - 'customer-dashboard/**/*.css'
                - 'customer-dashboard/**/*.html'
                - 'customer-dashboard/shared/**/*.js'
                - 'scripts/verify-customer-design-foundation.mjs'
                - 'scripts/audit-customer-design-ownership.mjs'
                - '.github/workflows/verify-customer-design-foundation.yml'

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - run: node scripts/verify-customer-design-foundation.mjs
                - name: Inventory design ownership
                  run: node scripts/audit-customer-design-ownership.mjs
          YAML
          rm -f scripts/tmp_fix_customer_requests_split.py
          rm -f .github/workflows/tmp-fix-customer-requests-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(customer): restore requests split pane owner"
          git push origin HEAD:codex/customer-settings-commercial-flows
