name: Verify Customer Design Foundation

on:
  pull_request:
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - 'scripts/tmp-inspect-customer-report.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/**/*.css'
      - 'customer-dashboard/**/*.html'
      - 'customer-dashboard/shared/**/*.js'
      - 'scripts/verify-customer-design-foundation.mjs'
      - 'scripts/audit-customer-design-ownership.mjs'
      - '.github/workflows/verify-customer-design-foundation.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correct protected report boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-inspect-customer-report.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''const protectedRanges = [
            ['dashboard', 'id="tab-dashboard"', 'id="tab-anrufe"'],
            ['requests', 'id="tab-anrufe"', 'id="tab-assistent"'],
            ['assistant', 'id="tab-assistent"', 'id="tab-auswertung"'],
            ['settings-navigation', 'id="tab-mehr"', 'id="mobile-bottom-nav"'],
            ['login', 'id="login-screen"', 'id="app-shell"'],
            ['tour', 'id="vx-onboarding-tour"', '</body>']
          ];
          const fingerprints = Object.fromEntries(protectedRanges.map(([name, start, end]) => [name, hash(sliceBetween(source, start, end))]));'''.replace(/^          /gm, '')
          new = '''const protectedRanges = [
            ['dashboard', 'id="tab-dashboard"', 'id="tab-anrufe"'],
            ['requests', 'id="tab-anrufe"', 'id="tab-auswertung"'],
            ['assistant', 'id="tab-assistent"', 'id="tab-mehr"'],
            ['settings-navigation', 'id="tab-mehr"', 'id="mobile-bottom-nav"']
          ];
          const fingerprints = Object.fromEntries(protectedRanges.map(([name, start, end]) => [name, hash(sliceBetween(source, start, end))]));
          const protectedWindowTokens = ['id="login-screen"', 'id="vx-onboarding-tour"', 'id="mobile-bottom-nav"'];
          const windowAround = (text, token) => {
            const index = text.indexOf(token);
            assert.ok(index >= 0, `Missing protected window token: ${token}`);
            return text.slice(Math.max(0, index - 2200), Math.min(text.length, index + 4200));
          };
          const windowFingerprints = Object.fromEntries(protectedWindowTokens.map((token) => [token, hash(windowAround(source, token))]));'''.replace(/^          /gm, '')
          if old not in text:
              raise SystemExit('Original protected range block not found')
          text = text.replace(old, new, 1)
          old_check = '''for (const [name, start, end] of protectedRanges) {
            assert.equal(hash(sliceBetween(source, start, end)), fingerprints[name], `Protected surface changed: ${name}`);
          }'''.replace(/^          /gm, '')
          new_check = old_check + '''
          for (const token of protectedWindowTokens) {
            assert.equal(hash(windowAround(source, token)), windowFingerprints[token], `Protected window changed: ${token}`);
          }'''.replace(/^          /gm, '')
          if old_check not in text:
              raise SystemExit('Original protected validation block not found')
          text = text.replace(old_check, new_check, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply guarded customer report migration
        run: node scripts/tmp-inspect-customer-report.mjs
      - name: Restore temporary migration source
        run: git checkout -- scripts/tmp-inspect-customer-report.mjs
      - name: Verify customer design foundation
        run: node scripts/verify-customer-design-foundation.mjs
      - name: Verify customer runtime reachability
        run: node scripts/audit-customer-runtime-reachability.mjs
      - name: Inventory design ownership
        run: node scripts/audit-customer-design-ownership.mjs
      - name: Verify report migration scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = ['customer-dashboard/index.html', 'customer-dashboard/shared/customer-assistant-components.css']
          if changed != expected:
              raise SystemExit(f'Unexpected product scope: {changed}')

          index = Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          css = Path('customer-dashboard/shared/customer-assistant-components.css').read_text(encoding='utf-8')
          required = [
              'vx-report-stack', 'vx-report-periods', 'vx-report-kpis',
              'vx-report-highlights', 'vx-report-week-chart',
              'vx-report-breakdowns', 'vx-report-leads'
          ]
          for token in required:
              if token not in index and token not in css:
                  raise SystemExit(f'Missing canonical report token: {token}')
          if 'au-period-active' in index:
              raise SystemExit('Legacy report period state remains')
          print('Customer report migration scope verification passed.')
          PY
      - name: Commit customer report migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css
          git commit -m "refactor(customer): migrate report to assistant design"
          git push origin HEAD:${{ github.head_ref }}
