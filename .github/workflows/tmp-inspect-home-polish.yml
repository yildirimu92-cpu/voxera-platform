name: Temporary Migrate Home Premium

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-home-polish.yml
      - scripts/tmp_migrate_home_premium.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-home-premium-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded home migration
        run: python scripts/tmp_migrate_home_premium.py
      - name: Consolidate existing design ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path=Path('customer-dashboard/index.html')
          index=index_path.read_text(encoding='utf-8')
          start='  /* ── KPI Strip: 2×2 Grid statt 4 Spalten ─────────────────── */'
          end='  /* ── Call-Row Header (cr-head): kompakter auf Mobile ─────── */'
          if index.count(start) != 1 or index.count(end) != 1:
            raise SystemExit('legacy KPI mobile block boundary mismatch')
          lo=index.index(start)
          hi=index.index(end, lo)
          index=index[:lo] + index[hi:]
          index_path.write_text(index, encoding='utf-8')

          css_path=Path('customer-dashboard/shared/customer-assistant-components.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* Customer home: premium assistant-aligned workspace. */'
          pos=css.find(marker)
          if pos < 0: raise SystemExit('home premium CSS marker missing')
          prefix=css[:pos].rstrip()
          block=css[pos:].replace(' !important', '').replace('!important', '')
          block=re.sub(r'\s+', ' ', block).strip()
          if '!important' in block:
            raise SystemExit('home premium owner still contains important overrides')
          css_path.write_text(prefix + '\n' + block + '\n', encoding='utf-8')
          PY
      - name: Verify existing customer contracts
        run: |
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/verify-customer-actions.mjs
          node scripts/verify-p0-security-foundation.mjs
          node scripts/verify-calendar-integrations.mjs
      - name: Verify premium home scope
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          css=Path('customer-dashboard/shared/customer-assistant-components.css').read_text(encoding='utf-8')
          required_index=[
            'id="kpi-callbacks-note" class="vx-ap-meta" hidden',
            'id="kpi-today-note" class="vx-ap-meta" hidden',
            'id="kpi-done-note" class="vx-ap-meta" hidden',
            'id="kpi-reach-label" class="vx-ap-meta" hidden',
            "cell.setAttribute('role', canOpen ? 'button' : 'group')",
            "ev.key === 'Enter' || ev.key === ' '"
          ]
          missing=[token for token in required_index if token not in index]
          if missing: raise SystemExit('missing home tokens: ' + ', '.join(missing))
          forbidden=[
            "kpiCallbacksNote.textContent = 'Eingänge seit Tagesbeginn'",
            "kpiTodayNote.textContent = 'Nicht bearbeitet'",
            "kpiDoneNote.textContent = 'Priorisiert oder überfällig'",
            "kpiReachLabel.textContent = 'Heute abgeschlossen'",
            'KPI Strip: 2×2 Grid statt 4 Spalten'
          ]
          present=[token for token in forbidden if token in index]
          if present: raise SystemExit('legacy KPI presentation remains: ' + ', '.join(present))
          required_css=[
            'Customer home: premium assistant-aligned workspace.',
            '#dash-kpi-strip',
            'grid-template-columns: repeat(4, minmax(0, 1fr));',
            'background: #eef4ff;',
            '#dash-priority-section',
            'margin-bottom: 20px;',
            '#tab-dashboard .vx-ops-item'
          ]
          missing=[token for token in required_css if token not in css]
          if missing: raise SystemExit('missing home CSS tokens: ' + ', '.join(missing))
          if css.count('Customer home: premium assistant-aligned workspace.') != 1:
            raise SystemExit('home CSS owner must exist exactly once')
          if '!important' in css:
            raise SystemExit('assistant owner must not contain important overrides')
          if len(css.splitlines()) > 800:
            raise SystemExit('assistant owner size budget exceeded')
          PY
          git diff --check
      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "polish: refine customer home hierarchy"
            git push origin HEAD:codex/customer-home-premium-polish
          fi
