name: Verify prompt fingerprint

on:
  pull_request:
    paths:
      - 'admin-panel/netlify/functions/_lib/prompt-fingerprint.js'
      - 'admin-panel/netlify/functions/_lib/prompt-builder-v2.js'
      - 'admin-panel/netlify/functions/trigger-elevenlabs-sync.js'
      - 'admin-panel/netlify/functions/_lib/elevenlabs-sync.js'
      - 'admin-panel/netlify/functions/elevenlabs-sync-status.js'
      - 'scripts/verify-prompt-fingerprint.mjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-prompt-fingerprint.mjs
