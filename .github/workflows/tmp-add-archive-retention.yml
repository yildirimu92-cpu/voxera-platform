name: Add Integrated Archive Retention Notice

on:
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - 'scripts/tmp_add_archive_retention.py'
      - '.github/workflows/tmp-add-archive-retention.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add retention information to integrated archive
        run: python scripts/tmp_add_archive_retention.py
      - name: Verify customer and security foundations
        run: |
          node scripts/verify-customer-navigation-unified.mjs
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/audit-customer-design-ownership.mjs
          node scripts/verify-p0-security-foundation.mjs
      - name: Commit product correction
        run: |
          changed="$(git diff --name-only)"
          expected=$'customer-dashboard/index.html\ncustomer-dashboard/shared/customer-assistant-components.css'
          if [ -z "$changed" ]; then
            echo "Archive retention notice already committed."
            exit 0
          fi
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css
          git commit -m "fix: preserve retention notice in integrated archive"
          git push origin HEAD:codex/customer-navigation-five-root
