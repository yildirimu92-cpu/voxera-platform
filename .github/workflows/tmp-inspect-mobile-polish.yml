name: Temporary Mobile Polish Migration

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-mobile-polish.yml'
      - 'scripts/tmp-mobile-polish-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - name: Apply contract-safe corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              old = p.read_text(encoding='utf-8')
              new = fn(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit('missing target: ' + label)

          def patch_index(text):
              text = text.replace('''\n                <div class="vx-ap-meta vx-archive-retention" role="note">\n                  Aufbewahrung: vollständige Transkripte werden nach <strong>90 Tagen</strong> entfernt, Archiveinträge nach <strong>180 Tagen</strong>.\n                </div>\n''', '\n', 1)
              text = replace_once(text, '''function vxMehrShow(sub) {\n  document.getElementById('mehr-main').style.display = 'none';\n  document.querySelectorAll('[id^="mehr-sub-"]').forEach(el => el.style.display = 'none');\n  const el = document.getElementById('mehr-sub-' + sub);\n  if (el) {\n    el.style.display = 'block';''', '''function vxMehrShow(sub) {\n  const main = document.getElementById('mehr-main');\n  if (!main) return;\n  main.removeAttribute('style');\n  main.hidden = true;\n  document.querySelectorAll('#tab-mehr [id^="mehr-sub-"]').forEach(el => { el.removeAttribute('style'); el.hidden = true; });\n  const el = document.getElementById('mehr-sub-' + sub);\n  if (el) {\n    el.hidden = false;''', 'vxMehrShow')
              text = replace_once(text, '''function vxMehrBack() {\n  document.querySelectorAll('[id^="mehr-sub-"]').forEach(el => el.style.display = 'none');\n  document.getElementById('mehr-main').style.display = 'block';\n}''', '''function vxMehrBack() {\n  document.querySelectorAll('#tab-mehr [id^="mehr-sub-"]').forEach(el => { el.removeAttribute('style'); el.hidden = true; });\n  const main = document.getElementById('mehr-main');\n  if (main) { main.removeAttribute('style'); main.hidden = false; }\n}''', 'vxMehrBack')
              text = re.sub(r'/\* Pill hinter aktivem Icon \*/\s*\.mobile-nav-btn\.active \.mobile-nav-icon-wrap::before\{.*?\}\s*@keyframes navPillIn\{.*?\}\s*/\* Icon leicht größer wenn aktiv \*/\s*\.mobile-nav-btn\.active svg,\s*\.mobile-nav-btn\.active \.lucide\{.*?\}\s*', '', text, count=1, flags=re.S)
              text = text.replace('.mobile-nav-btn.active{color:#fff;font-weight:700;}\n', '')
              return text

          def patch_assistant_css(text):
              rule = 'body.vx-customer-design-foundation #dash-priority-section + #dash-activity-section{margin-top:16px;}\n'
              marker = '/* Customer report: assistant-aligned canonical component owner. */\n'
              return text if rule in text else replace_once(text, marker, rule + marker, 'dashboard card spacing')

          def patch_navigation_css(text):
              old = '''body.vx-customer-design-foundation .mobile-nav-btn.vx-root-nav-active {\n  color: #1a6fe8;\n}\n\nbody.vx-customer-design-foundation .mobile-nav-btn.vx-root-nav-active .mobile-nav-icon-wrap {\n  background: #eef4ff;\n  color: #1a6fe8;\n}\n'''
              new = '''body.vx-customer-design-foundation .mobile-nav-btn {\n  gap: 5px;\n  padding-right: 2px;\n  padding-left: 2px;\n  color: rgba(255, 255, 255, 0.5);\n}\n\nbody.vx-customer-design-foundation .mobile-nav-btn .mobile-nav-icon-wrap {\n  width: 34px;\n  height: 28px;\n  border-radius: 10px;\n  background: transparent;\n  color: inherit;\n}\n\nbody.vx-customer-design-foundation .mobile-nav-btn:is(.active, .vx-root-nav-active) {\n  color: #5b9cff;\n  font-weight: 700;\n}\n\nbody.vx-customer-design-foundation .mobile-nav-btn:is(.active, .vx-root-nav-active) .mobile-nav-icon-wrap {\n  background: rgba(52, 120, 237, 0.18);\n  color: #5b9cff;\n}\n\nbody.vx-customer-design-foundation .mobile-nav-btn:is(.active, .vx-root-nav-active) :where(i, svg, .lucide) {\n  color: #5b9cff;\n  stroke: #5b9cff;\n}\n'''
              return replace_once(text, old, new, 'canonical mobile active state')

          def patch_calendar(text):
              anchor = '''  function visibleProviders() {\n    const configured = state?.provider_configured || {};\n    const announced = Array.isArray(state?.available_providers) ? state.available_providers : Object.keys(providerLabels);\n    return announced.filter((provider) => providerLabels[provider] && (configured[provider] === true || connection(provider)));\n  }\n'''
              helper = anchor + '''\n  function noticeOptions(value) {\n    const selected = Number(value || 120);\n    const presets = [[30, '30 Minuten'], [60, '1 Stunde'], [120, '2 Stunden'], [360, '6 Stunden'], [720, '12 Stunden'], [1440, '24 Stunden'], [2880, '2 Tage'], [4320, '3 Tage'], [5760, '4 Tage'], [10080, '7 Tage']];\n    if (!presets.some(([minutes]) => minutes === selected)) presets.unshift([selected, selected + ' Minuten']);\n    return presets.map(([minutes, label]) => '<option value="' + minutes + '"' + (minutes === selected ? ' selected' : '') + '>' + label + '</option>').join('');\n  }\n'''
              if 'function noticeOptions(value)' not in text:
                  text = replace_once(text, anchor, helper, 'notice presets')
              text = replace_once(text, '''    body.innerHTML =\n      '<div class="vx-cal-banner ' + (state.enabled ? 'ok' : '') + '">' +\n      (state.enabled ? 'Kalenderintegration ist freigeschaltet. Verbindungen bleiben kundenspezifisch.' : 'Sicher vorbereitet, aber noch nicht produktiv aktiviert. Verbindungen und Buchungen sind gesperrt.') +\n      '</div><div id="vx-calendar-status" class="vx-cal-status" role="status" aria-live="polite"></div>' +''', '''    const availabilityBanner = state.enabled ? '' : '<div class="vx-cal-banner">Sicher vorbereitet, aber noch nicht produktiv aktiviert. Verbindungen und Buchungen sind gesperrt.</div>';\n\n    body.innerHTML =\n      availabilityBanner + '<div id="vx-calendar-status" class="vx-cal-status" role="status" aria-live="polite"></div>' +''', 'calendar enabled banner')
              text = replace_once(text, '''      '<div class="vx-cal-field"><label>Mindestvorlauf (Min.)</label><input id="vx-cal-notice" type="number" min="0" max="10080" value="' + esc(settings.minimum_notice_minutes || 120) + '"></div>' +''', '''      '<div class="vx-cal-field"><label>Mindestvorlauf</label><select id="vx-cal-notice">' + noticeOptions(settings.minimum_notice_minutes || 120) + '</select></div>' +''', 'minimum notice dropdown')
              pattern = re.compile(r'  function setCalendarPageOpen\(isOpen\) \{.*?\n  \}\n\n  function open\(\)', re.S)
              replacement = '''  function setCalendarPageOpen(isOpen) {\n    const main = document.getElementById('mehr-main');\n    const page = document.getElementById('mehr-sub-kalender');\n    if (!main || !page) return false;\n    document.querySelectorAll('#tab-mehr [id^="mehr-sub-"]').forEach((node) => { node.hidden = true; });\n    page.removeAttribute('style');\n    if (isOpen) {\n      main.hidden = true;\n      page.hidden = false;\n    } else {\n      page.hidden = true;\n      main.hidden = false;\n    }\n    return true;\n  }\n\n  function open()'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1 and "page.removeAttribute('style')" not in text:
                  raise SystemExit('missing target: calendar page state')
              return text

          def patch_unified(text):
              old = '''  function restoreSettingsRoot() {\n    const main = document.getElementById('mehr-main');\n    if (main) {\n      main.hidden = false;\n      main.style.display = '';\n    }\n    document.querySelectorAll('#tab-mehr [id^="mehr-sub-"]').forEach((node) => {\n      node.hidden = true;\n      node.style.display = 'none';\n    });\n  }'''
              new = '''  function restoreSettingsRoot() {\n    const main = document.getElementById('mehr-main');\n    if (main) { main.removeAttribute('style'); main.hidden = false; }\n    document.querySelectorAll('#tab-mehr [id^="mehr-sub-"]').forEach((node) => { node.removeAttribute('style'); node.hidden = true; });\n  }'''
              return replace_once(text, old, new, 'settings root state')

          edit('customer-dashboard/index.html', patch_index)
          edit('customer-dashboard/shared/customer-assistant-components.css', patch_assistant_css)
          edit('customer-dashboard/shared/customer-navigation-components.css', patch_navigation_css)
          edit('customer-dashboard/shared/customer-runtime-calendar-settings.js', patch_calendar)
          edit('customer-dashboard/shared/customer-runtime-unified-navigation.js', patch_unified)
          PY
      - name: Validate focused contracts
        run: |
          node --check customer-dashboard/shared/customer-runtime-calendar-settings.js
          node --check customer-dashboard/shared/customer-runtime-unified-navigation.js
          node scripts/verify-calendar-integrations.mjs
          node scripts/verify-customer-design-foundation.mjs
      - name: Commit product corrections
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css customer-dashboard/shared/customer-navigation-components.css customer-dashboard/shared/customer-runtime-calendar-settings.js customer-dashboard/shared/customer-runtime-unified-navigation.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: polish mobile dashboard and calendar states'
          git push origin HEAD:codex/customer-navigation-five-root
