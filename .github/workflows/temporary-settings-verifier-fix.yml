name: Temporary settings verifier correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct and verify settings contract
        run: |
          node scripts/temporary-narrow-settings-verifier.mjs
          node scripts/verify-customer-design-foundation.mjs
      - name: Commit verifier correction
        run: |
          if git diff --quiet -- scripts/verify-customer-design-foundation.mjs; then
            echo "No verifier change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-customer-design-foundation.mjs
          git commit -m "Scope settings progress legacy verification"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
