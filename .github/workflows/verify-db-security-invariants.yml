# Prueft die Security-Invarianten gegen die ECHTEN Datenbanken.
#
# Abgrenzung zu p0-security-verification.yml: der dortige Check liest Repo-
# Dateien. Die P0-Migration vom 2026-07-28 lag korrekt im Repo, war auf der
# Datenbank aber nie angewandt -- der Check blieb wochenlang gruen, obwohl
# keine der Policies existierte. Dieser Workflow oeffnet stattdessen eine echte
# Session gegen die Datenbank und misst nach, was `anon` und `authenticated`
# tatsaechlich duerfen.
name: DB Security Invariants (Produktion + Staging)

# BEWUSST OHNE `pull_request`. Zwei Gruende, beide aus dem Review von PR #835:
#
# 1. Zugangsdaten. `actions/checkout` holt bei einem PR den PR-Stand, und erst
#    danach bekommt der Job das Produktions-Secret in die Umgebung. Der PR
#    koennte also den Runner oder eine der SQL-Dateien so aendern, dass sie den
#    Connection-String ausgibt oder DML ausserhalb des Rollbacks ausfuehrt. Der
#    Fork-Filter half dagegen nicht: bei Same-Repo-PRs greift er nicht, und
#    genau die sind der Fall. Review-CI darf kein Weg zu Produktionszugriff
#    sein -- schon gar nicht bei einem Security-Check.
#
# 2. Der Ledger-Check wuerde jeden Migrations-PR rot faerben. Eine Migration
#    liegt im PR-Baum, ist auf Produktion aber korrekt noch nicht angewandt --
#    der Drift-Check meldet zutreffend "nicht angewandt" und der PR waere nur
#    gruen zu bekommen, indem man ungemergten Code vorab einspielt. Genau
#    verkehrt herum.
#
# Der Verlust ist gering: der PR-Lauf haette ohnehin nur bereits bestehenden
# Drift gefunden, und den findet der 6-Stunden-Lauf auch.
on:
  # Nach dem Merge -- der Moment, in dem eine Migration angewandt sein muesste.
  push:
    branches:
      - main
  # Der eigentliche Schutz: Drift entsteht auch OHNE Commit (manuelle Aenderung,
  # nie angewandte Migration, zurueckgesetzte Policy). Nur ein zeitgesteuerter
  # Lauf gegen die echte DB findet das.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-security-invariants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Security-Invarianten gegen ${{ matrix.umgebung }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ZWEI UMGEBUNGEN statt einer. Grund: Am 2026-08-11 kam heraus, dass
    # Staging 29 Tabellen mit TRUNCATE fuer anon/authenticated traegt -- den
    # Zustand, den #892 auf Produktion beseitigt hat. Aufgefallen ist das nur,
    # weil jemand von Hand nachgemessen hat. Lief der Check nur gegen
    # Produktion, konnte die Abweichung gar nicht auffallen, und jedes "auf
    # Staging geprueft" war unbemerkt eine Aussage ueber eine andere Datenbank.
    #
    # Siehe docs/TICKET_STAGING_LEDGER_DIVERGENZ_2026-08-11.md.
    #
    # ZU DEN SECRET-NAMEN: Jede Umgebung fuehrt ihre EIGENEN, und zwar auch
    # fuer die Einzelfelder. Das ist kein Schoenheitsfehler, sondern der
    # gefaehrlichste Punkt dieser Datei. Das Skript bevorzugt die Einzelfelder
    # gegenueber dem Connection-String (`useParts` gewinnt, Zeile 80). Blieben
    # SUPABASE_DB_HOST/_USER/_PASSWORD unqualifiziert stehen und waeren sie auf
    # Repo-Ebene gesetzt, wuerde der Staging-Job sie erben und dann die
    # PRODUKTIONS-Datenbank messen -- unter der Ueberschrift "Staging". Ein
    # Bericht, der die falsche Datenbank benennt, ist schlimmer als keiner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - umgebung: Produktion
            environment: production-db-readonly
            secret_url: SUPABASE_DB_URL_CI_VERIFIER
            secret_host: SUPABASE_DB_HOST
            secret_port: SUPABASE_DB_PORT
            secret_user: SUPABASE_DB_USER
            secret_password: SUPABASE_DB_PASSWORD
            ledger_abgleich: 'an'
            blockierend: true
          - umgebung: Staging
            environment: staging-db-readonly
            secret_url: SUPABASE_DB_URL_CI_VERIFIER_STAGING
            secret_host: SUPABASE_DB_HOST_STAGING
            secret_port: SUPABASE_DB_PORT_STAGING
            secret_user: SUPABASE_DB_USER_STAGING
            secret_password: SUPABASE_DB_PASSWORD_STAGING
            # Ledger-Abgleich aus -- der einzige Teil des Checks, der auf
            # Staging nichts aussagt. Produktion und Staging teilen NULL
            # gemeinsame Migrationsversionen; der Abgleich meldete dort jede
            # Repo-Datei als "nicht angewandt" und jede Ledger-Zeile als
            # Waise. Das Skript meldet die Abschaltung als SKIP mit
            # Begruendung, verschweigt sie also nicht.
            # Grants, RLS und Default-Privilegien werden weiterhin voll
            # geprueft -- das sind die Befunde, um die es hier geht.
            ledger_abgleich: 'aus'
            # Bewusst NICHT blockierend -- vorerst.
            #
            # Staging ist heute nachweislich abweichend: eigene Migrationslinie
            # (null gemeinsame Versionen mit Produktion), 29 Tabellen mit
            # TRUNCATE fuer Browser-Rollen. Der Lauf ist dort also rot, und
            # zwar zu Recht.
            #
            # Waere er blockierend, waere main ab sofort dauerhaft rot -- und
            # ein Waechter, den man wegklickt, ist schlimmer als keiner. Das
            # Ergebnis bleibt trotzdem im Lauf sichtbar; nur blockiert es nicht.
            #
            # DIESE ZEILE GEHOERT ENTFERNT, sobald Entscheidung A oder B aus
            # dem Staging-Ticket umgesetzt ist. Solange sie steht, ist sie
            # selbst der Merkposten dafuer, dass die Abweichung noch besteht.
            blockierend: false
    # Eigenes Environment: der Zugriff auf die Produktions-Zugangsdaten ist
    # dadurch einzeln auditierbar und kann unabhaengig entzogen werden. In
    # Kombination mit den Triggern oben laeuft dieser Job ausschliesslich auf
    # Code, der bereits in main steht -- nie auf ungeprueftem PR-Stand.
    environment: ${{ matrix.environment }}
    continue-on-error: ${{ !matrix.blockierend }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: psql bereitstellen
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Invarianten gegen ${{ matrix.umgebung }} pruefen
        env:
          # Zwei Wege, das Skript nimmt was da ist. Die Einzelfelder haben
          # Vorrang und sind der robustere Weg: beim Connection-String muessen
          # Sonderzeichen im Passwort URL-kodiert werden, und "/" oder "@"
          # zerlegen ihn falsch -- `openssl rand -base64 32` erzeugt genau
          # solche Zeichen. Ueber PGPASSWORD wird nichts geparst.
          SUPABASE_DB_HOST: ${{ secrets[matrix.secret_host] }}
          SUPABASE_DB_PORT: ${{ secrets[matrix.secret_port] }}
          SUPABASE_DB_USER: ${{ secrets[matrix.secret_user] }}
          SUPABASE_DB_PASSWORD: ${{ secrets[matrix.secret_password] }}
          SUPABASE_DB_URL: ${{ secrets[matrix.secret_url] }}
          # Damit im Log und in der Summary steht, WELCHE Datenbank gemessen
          # wurde. Ohne das sind zwei Matrix-Berichte nicht unterscheidbar.
          UMGEBUNG: ${{ matrix.umgebung }}
          LEDGER_ABGLEICH: ${{ matrix.ledger_abgleich }}
          LEDGER_ABGLEICH_GRUND: >-
            Staging fuehrt eine eigene Migrationslinie (null gemeinsame
            Versionen mit Produktion) -- siehe
            docs/TICKET_STAGING_LEDGER_DIVERGENZ_2026-08-11.md
        run: node scripts/verify-db-security-invariants.mjs
