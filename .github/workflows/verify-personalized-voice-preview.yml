name: Verify Personalized Voice Preview

on:
  pull_request:
    paths:
      - 'customer-dashboard/netlify/functions/preview-voice.js'
      - 'customer-dashboard/netlify/functions/_lib/assistant-greeting.js'
      - 'supabase/migrations/2026-08-09_customer_voice_previews.sql'
      - 'scripts/verify-personalized-voice-preview.mjs'
      - '.github/workflows/verify-personalized-voice-preview.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/netlify/functions/preview-voice.js'
      - 'customer-dashboard/netlify/functions/_lib/assistant-greeting.js'
      - 'supabase/migrations/2026-08-09_customer_voice_previews.sql'
      - 'scripts/verify-personalized-voice-preview.mjs'
      - '.github/workflows/verify-personalized-voice-preview.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node --check customer-dashboard/netlify/functions/preview-voice.js
      - name: Verify personalized voice preview contracts
        run: node scripts/verify-personalized-voice-preview.mjs
