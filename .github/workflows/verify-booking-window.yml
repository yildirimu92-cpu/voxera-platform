name: Verify Booking Window

# Ohne Pfad-Filter, gleiche Begruendung wie bei verify-prompt-builder-v2:
# wer eine gelesene Datei anfasst, sie aber nicht in die Pfadliste eingetragen
# hat, bekommt einen uebersprungenen statt eines bestandenen Laufs -- und
# uebersprungen sieht in der PR-Ansicht nicht nach einer Luecke aus.
#
# Der Check sichert die Regel aus #930: Buchungszeiten sind eine TEILMENGE der
# Oeffnungszeiten, nie eine Erweiterung. Sagt das Geschaeftsprofil fuer einen
# Tag "geschlossen", darf dort kein Termin gebucht werden, egal was in
# calendar_settings.business_hours steht.
#
# Bis zum 2026-08-10 hatte business_hours ueberhaupt keinen Leser: die
# Terminbuchung pruefte keinerlei Zeiten, und der Agent konnte 03:00 Uhr
# bestaetigen, sofern im verbundenen Kalender nichts eingetragen war.
# Mitgeprueft wird die Zeitzonenrechnung -- auf Netlify laeuft der Server in
# UTC, im Sommer eine Stunde neben Europe/Zurich und im Winter zwei.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-booking-window.mjs
