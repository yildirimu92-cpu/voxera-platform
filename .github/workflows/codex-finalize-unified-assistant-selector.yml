name: Codex Finalize Unified Assistant Selector

on:
  push:
    branches:
      - codex/tmp-complete-customer-baseline-20260806
    paths:
      - .github/workflows/codex-finalize-unified-assistant-selector.yml

permissions:
  contents: write

jobs:
  patch-transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct exact Assistant CSS owner selector
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/tmp-complete-customer-baseline-20260806"
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-final-customer-baseline.py')
          text = path.read_text(encoding='utf-8')
          old = r"assert.match(source.assistantCss, /#tab-assistent > :not\\(#vx-assistant-root-switch\\):not\\(#vx-assistant-root-host\\):not\\(\\.vx-assistant-root-header\\)/);"
          new = r"assert.match(source.assistantCss, /#tab-assistent > :not\\(#vx-assistant-root-header\\):not\\(#vx-assistant-root-switch\\):not\\(#vx-assistant-root-host\\)/);"
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile .github/scripts/apply-final-customer-baseline.py
          test "$(git diff --name-only)" = ".github/scripts/apply-final-customer-baseline.py"
          git diff -- .github/scripts/apply-final-customer-baseline.py

      - name: Commit script-only correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/apply-final-customer-baseline.py
          git diff --cached --name-status
          git diff --cached --stat
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "chore: finalize unified assistant selector contract"
          git push origin HEAD:codex/tmp-complete-customer-baseline-20260806
