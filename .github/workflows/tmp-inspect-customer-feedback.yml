name: Apply Customer Feedback Corrections

on:
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - 'scripts/tmp_apply_customer_feedback_round.py'
      - 'scripts/tmp_customer_feedback_trigger.txt'
      - '.github/workflows/tmp-inspect-customer-feedback.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correct temporary migration anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_apply_customer_feedback_round.py')
          source = path.read_text(encoding='utf-8')
          old = '''    source, month_filter_count = re.subn(
        r"else if \\(_auPeriod === 'month'\\) start = new Date\\(now\\.getFullYear\\(\\), now\\.getMonth\\(\\), 1\\);",
        "else if (_auPeriod === 'month') start = new Date(now.getTime() - 30*86400000);",
        source,
        count=1,
    )
    if month_filter_count == 0 and "else if (_auPeriod === 'month') start = new Date(now.getTime() - 30*86400000);" not in source:
        raise AssertionError('rolling 30-day report filter anchor missing')
'''
          new = '''    month_filter = """  } else if (_auPeriod === 'month') {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
"""
    rolling_month_filter = """  } else if (_auPeriod === 'month') {
    start = new Date(now.getTime() - 30 * 86400000);
"""
    source = replace_once(source, month_filter, rolling_month_filter, 'rolling 30-day report filter')
'''
          if old not in source:
              raise AssertionError('temporary month anchor block not found')
          source = source.replace(old, new, 1)
          source = source.replace(
              'end = new Date(now.getTime() - 30*86400000);',
              'end = new Date(now.getTime() - 30 * 86400000);',
          )
          source = source.replace(
              'start = new Date(now.getTime() - 60*86400000);',
              'start = new Date(now.getTime() - 60 * 86400000);',
          )
          source = source.replace(
              'assert "start = new Date(now.getTime() - 30*86400000);" in index',
              'assert "start = new Date(now.getTime() - 30 * 86400000);" in index',
          )
          source = source.replace(
              'assert "start = new Date(now.getTime() - 60*86400000);" in index',
              'assert "start = new Date(now.getTime() - 60 * 86400000);" in index',
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply requested customer corrections
        run: python scripts/tmp_apply_customer_feedback_round.py
      - name: Verify customer runtime and design owners
        run: |
          node --check customer-dashboard/shared/customer-runtime-unified-navigation.js
          node --check customer-dashboard/shared/customer-runtime-calendar-settings.js
          node scripts/verify-customer-navigation-unified.mjs
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/audit-customer-design-ownership.mjs
      - name: Commit product corrections
        run: |
          git checkout -- scripts/tmp_apply_customer_feedback_round.py
          changed="$(git diff --name-only)"
          expected=$'customer-dashboard/index.html\ncustomer-dashboard/shared/customer-assistant-components.css\ncustomer-dashboard/shared/customer-runtime-calendar-settings.js\ncustomer-dashboard/shared/customer-runtime-unified-navigation.js'
          if [ -z "$changed" ]; then
            echo "Customer corrections already committed."
            exit 0
          fi
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html \
            customer-dashboard/shared/customer-assistant-components.css \
            customer-dashboard/shared/customer-runtime-calendar-settings.js \
            customer-dashboard/shared/customer-runtime-unified-navigation.js
          git commit -m "fix: resolve customer mobile feedback"
          git push origin HEAD:codex/customer-navigation-five-root
