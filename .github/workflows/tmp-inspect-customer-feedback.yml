name: Apply Customer Feedback Corrections

on:
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - 'scripts/tmp_apply_customer_feedback_round.py'
      - '.github/workflows/tmp-inspect-customer-feedback.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-navigation-five-root
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply requested customer corrections
        run: python scripts/tmp_apply_customer_feedback_round.py
      - name: Verify customer runtime and design owners
        run: |
          node --check customer-dashboard/shared/customer-runtime-unified-navigation.js
          node --check customer-dashboard/shared/customer-runtime-calendar-settings.js
          node scripts/verify-customer-navigation-unified.mjs
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/audit-customer-design-ownership.mjs
      - name: Commit product corrections
        run: |
          changed="$(git diff --name-only)"
          expected=$'customer-dashboard/index.html\ncustomer-dashboard/shared/customer-assistant-components.css\ncustomer-dashboard/shared/customer-runtime-calendar-settings.js\ncustomer-dashboard/shared/customer-runtime-unified-navigation.js'
          if [ -z "$changed" ]; then
            echo "Customer corrections already committed."
            exit 0
          fi
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html \
            customer-dashboard/shared/customer-assistant-components.css \
            customer-dashboard/shared/customer-runtime-calendar-settings.js \
            customer-dashboard/shared/customer-runtime-unified-navigation.js
          git commit -m "fix: resolve customer mobile feedback"
          git push origin HEAD:codex/customer-navigation-five-root
