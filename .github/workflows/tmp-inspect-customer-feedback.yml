name: Inspect Exact Report Filter

on:
  pull_request:
    paths:
      - 'customer-dashboard/index.html'
      - '.github/workflows/tmp-inspect-customer-feedback.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact report filter
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          for needle in ['function _auFilterRecords', "_auPeriod === 'month'"]:
              matches = [i for i, line in enumerate(lines) if needle in line]
              print(f'===== {needle}: {len(matches)} =====')
              for i in matches[:5]:
                  for n in range(max(0, i - 12), min(len(lines), i + 32)):
                      print(f'{n + 1}: {lines[n]}')
          PY
