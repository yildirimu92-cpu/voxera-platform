name: Inspect Customer Feedback Owners

on:
  pull_request:
    paths:
      - 'customer-dashboard/**'
      - '.github/workflows/tmp-inspect-customer-feedback.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect report periods and dashboard layout
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          for needle in ['function _auPrevPeriodRecords', 'id="au-period-row"', 'id="tab-dashboard"', 'id="dash-main"', 'dashboard-content']:
              matches = [i for i, line in enumerate(index) if needle in line]
              print(f'\n===== {needle}: {len(matches)} =====')
              for i in matches[:6]:
                  start = max(0, i - 16)
                  end = min(len(index), i + 85)
                  print(f'--- line {i + 1} ---')
                  for n in range(start, end):
                      print(f'{n + 1}: {index[n]}')

          for path in [
              Path('customer-dashboard/shared/customer-design-system.css'),
              Path('customer-dashboard/shared/customer-assistant-components.css')
          ]:
              lines = path.read_text(encoding='utf-8').splitlines()
              print(f'\n===== {path} spacing tokens =====')
              for i, line in enumerate(lines):
                  if any(token in line for token in ['gap:', 'margin-bottom:', '.vx-ops-card', '.vx-ap-grid']):
                      start = max(0, i - 2)
                      end = min(len(lines), i + 5)
                      for n in range(start, end):
                          print(f'{n + 1}: {lines[n]}')
          PY
