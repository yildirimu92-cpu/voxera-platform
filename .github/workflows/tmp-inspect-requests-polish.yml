name: Temporary Inspect Requests Polish

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-requests-polish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-requests-premium-polish
      - name: Inspect canonical request markup
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          keys=['vx-requests-layout','vx-requests-panel','vx-requests-detail-panel','vx-requests-filters','vx-requests-scroll','vx-requests-list']
          lowered=[line.lower() for line in lines]
          shown=set()
          for key in keys:
            hits=[i for i,line in enumerate(lowered) if key in line][:6]
            print(f'\n## {key} hits={len(hits)}')
            for i in hits:
              lo=max(0,i-12); hi=min(len(lines),i+30)
              if (lo,hi) in shown: continue
              shown.add((lo,hi))
              print(f'-- {lo+1}-{hi} --')
              for n in range(lo,hi): print(f'{n+1}: {lines[n]}')
          PY
