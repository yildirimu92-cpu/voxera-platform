name: Temporary Inspect Requests Remainders

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-requests-polish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-requests-premium-polish
      - name: Inspect remaining request selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          for term in ['#anrufe-split-left{', '#anrufe-list .sp-active,']:
            hits=[i for i,line in enumerate(lines) if term in line]
            print(f'## {term} hits={len(hits)}')
            for i in hits:
              lo=max(0,i-8); hi=min(len(lines),i+16)
              print(f'-- {lo+1}-{hi} --')
              for n in range(lo,hi): print(f'{n+1}: {lines[n]}')
          PY
