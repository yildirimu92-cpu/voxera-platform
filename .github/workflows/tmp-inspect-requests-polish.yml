name: Temporary Inspect Requests Polish

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-requests-polish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-requests-premium-polish
      - name: Inspect legacy request overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          print('## LEGACY DESIGN PASS')
          for lo,hi in [(33125,33245)]:
            hi=min(hi,len(lines))
            for n in range(lo,hi+1): print(f'{n}: {lines[n-1]}')
          terms=['#anrufe-list', '#tab-anrufe', '.vxfb-chip--active', '.vx-requests-item', '.vx-requests-panel']
          lowered=[line.lower() for line in lines]
          for term in terms:
            hits=[i for i,line in enumerate(lowered) if term.lower() in line][:20]
            print(f'\n## {term} hits={len(hits)}')
            for i in hits:
              lo=max(0,i-3); hi=min(len(lines),i+9)
              print(f'-- {lo+1}-{hi} --')
              for n in range(lo,hi): print(f'{n+1}: {lines[n]}')
          PY
