name: Temporary Inspect Requests Polish

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-requests-polish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-requests-premium-polish
      - name: Inspect exact request owners
        run: |
          python - <<'PY'
          from pathlib import Path

          lines=Path('customer-dashboard/index.html').read_text(encoding='utf-8').splitlines()
          css_lines=Path('customer-dashboard/shared/customer-assistant-components.css').read_text(encoding='utf-8').splitlines()

          print('## EXACT INDEX RANGES')
          for lo,hi in [(4990,5085),(5165,5245),(6515,6595),(26280,26460),(27660,27830)]:
            hi=min(hi,len(lines))
            print(f'-- {lo}-{hi} --')
            for n in range(lo,hi+1): print(f'{n}: {lines[n-1]}')

          terms=[
            "classList.add('selected')", 'classList.add("selected")',
            "classList.toggle('selected'", 'is-selected', 'selected-row',
            'active-call', 'openCallDetail', 'renderCalls', 'vx-call-list',
            'io-list-card', 'io-toolbar-card', 'split-detail', 'split-shell', 'filter-chip'
          ]
          lowered=[line.lower() for line in lines]
          for term in terms:
            key=term.lower()
            hits=[i for i,line in enumerate(lowered) if key in line][:8]
            if not hits: continue
            print(f'\n## TERM {term!r} hits={len(hits)}')
            for i in hits:
              lo=max(0,i-4); hi=min(len(lines),i+10)
              print(f'-- {lo+1}-{hi} --')
              for n in range(lo,hi): print(f'{n+1}: {lines[n]}')

          print('\n## ASSISTANT CSS REQUEST SELECTORS')
          keys=['request','anfragen','filter-chip','calls-list','split-detail','selected','io-list','io-toolbar']
          shown=set()
          for i,line in enumerate(css_lines):
            if not any(key in line.lower() for key in keys): continue
            lo=max(0,i-2); hi=min(len(css_lines),i+8)
            signature=(lo,hi)
            if signature in shown: continue
            shown.add(signature)
            print(f'-- {lo+1}-{hi} --')
            for n in range(lo,hi): print(f'{n+1}: {css_lines[n]}')
          print('ASSISTANT_CSS_LINES', len(css_lines))
          PY
