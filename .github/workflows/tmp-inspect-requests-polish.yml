name: Temporary Migrate Requests Premium

on:
  pull_request:
    paths:
      - .github/workflows/tmp-inspect-requests-polish.yml
      - scripts/tmp_migrate_requests_premium.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-requests-premium-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Complete guarded migration definition
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/tmp_migrate_requests_premium.py')
          text=path.read_text(encoding='utf-8')
          old="legacy_end = '@media (hover:none), (max-width:1099px){\\n}\\n'"
          new="""legacy_end = '''@media (hover:none), (max-width:1099px){
}

@media(max-width:1099px){
  #tab-anrufe .vx-split-left,
  #anrufe-split-left{
    width:100% !important;
    min-width:0 !important;
    max-width:none !important;
    border-radius:10px !important;
  }
}
'''"""
          if text.count(old) != 1: raise SystemExit('legacy end definition mismatch')
          text=text.replace(old,new,1)
          anchor="index = index.replace(old_active_fill, new_active_fill, 1)\n\nreplacements = {"
          extra="""index = index.replace(old_active_fill, new_active_fill, 1)

old_secondary_fill = '''#dash-priority-list .sp-active .dpr-row,
#anrufe-list .sp-active .dpr-row,
#dash-priority-list .dpr-card.sp-active .dpr-row,
#anrufe-list .dpr-card.sp-active .dpr-row{
  background:rgba(26,111,232,.05) !important;
}'''
new_secondary_fill = '''#dash-priority-list .sp-active .dpr-row,
#dash-priority-list .dpr-card.sp-active .dpr-row{
  background:rgba(26,111,232,.05) !important;
}'''
if index.count(old_secondary_fill) != 1:
    raise SystemExit(f'legacy secondary fill mismatch: {index.count(old_secondary_fill)}')
index = index.replace(old_secondary_fill, new_secondary_fill, 1)

old_secondary_rail = '''#dash-priority-list .sp-active,
#anrufe-list .sp-active,
#dash-priority-list .dpr-card.sp-active,
#anrufe-list .dpr-card.sp-active{
  border-left:3px solid var(--blue) !important;
}'''
new_secondary_rail = '''#dash-priority-list .sp-active,
#dash-priority-list .dpr-card.sp-active{
  border-left:3px solid var(--blue) !important;
}'''
if index.count(old_secondary_rail) != 1:
    raise SystemExit(f'legacy secondary rail mismatch: {index.count(old_secondary_rail)}')
index = index.replace(old_secondary_rail, new_secondary_rail, 1)

replacements = {"""
          if text.count(anchor) != 1: raise SystemExit('secondary cleanup anchor mismatch')
          text=text.replace(anchor,extra,1)
          old_guard="""forbidden_index = [
    legacy_start,
    '#anrufe-split-left{',
    '#anrufe-list .sp-active,',
    '#anrufe-list{\\n  background:var(--surface)!important;',
]"""
          new_guard="""forbidden_index = [
    legacy_start,
    '#anrufe-split-left{',
    '#anrufe-list .sp-active .dpr-row,',
    '#anrufe-list .dpr-card.sp-active .dpr-row{',
    '#anrufe-list{\\n  background:var(--surface)!important;',
]"""
          if text.count(old_guard) != 1: raise SystemExit('legacy guard mismatch')
          text=text.replace(old_guard,new_guard,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Apply guarded requests migration
        run: python scripts/tmp_migrate_requests_premium.py
      - name: Verify existing customer contracts
        run: |
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs
          node scripts/audit-customer-runtime-reachability.mjs
          node scripts/verify-customer-actions.mjs
          node scripts/verify-p0-security-foundation.mjs
          node scripts/verify-calendar-integrations.mjs
      - name: Verify premium requests scope
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('customer-dashboard/index.html').read_text(encoding='utf-8')
          css=Path('customer-dashboard/shared/customer-assistant-components.css').read_text(encoding='utf-8')
          required_index=['id="anrufe-split" class="vx-requests-layout"','id="anrufe-split-left" class="vx-ops-card vx-requests-panel"','id="anrufe-split-right" class="vx-ops-card vx-requests-detail-panel"',"el.classList.add('vx-ops-list', 'vx-requests-list')","el.classList.toggle('sp-active'"]
          missing=[x for x in required_index if x not in index]
          if missing: raise SystemExit('missing requests behavior tokens: '+', '.join(missing))
          forbidden=['PR-FIX 2026-05-23 — Anfragen Inbox nach Mockup','#anrufe-split-left{','#anrufe-list .sp-active .dpr-row,','#anrufe-list .dpr-card.sp-active .dpr-row{','#anrufe-list{\n  background:var(--surface)!important;']
          present=[x for x in forbidden if x in index]
          if present: raise SystemExit('legacy requests presentation remains: '+', '.join(present))
          required_css=['body.vx-customer-design-foundation #tab-anrufe{background:var(--vx-canvas);}','background:#e9eef5;','background:#e4efff;color:var(--vx-brand-dark);','background:#e3edff;','border-radius:14px;','box-shadow:0 8px 20px rgba(52,120,237,.11);']
          missing=[x for x in required_css if x not in css]
          if missing: raise SystemExit('missing premium request styles: '+', '.join(missing))
          if '!important' in css: raise SystemExit('assistant owner contains important overrides')
          if len(css.splitlines())>800: raise SystemExit('assistant owner size budget exceeded')
          PY
          git diff --check
      - name: Commit product migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html customer-dashboard/shared/customer-assistant-components.css
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "polish: align customer requests with assistant canvas"
            git push origin HEAD:codex/customer-requests-premium-polish
          fi
