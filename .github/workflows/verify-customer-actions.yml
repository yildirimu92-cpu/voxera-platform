name: Verify Customer Actions

on:
  pull_request:
    paths:
      - 'customer-dashboard/customer-action-contracts.json'
      - 'customer-dashboard/shared/customer-runtime-*.js'
      - 'customer-dashboard/shared/offer-brand.js'
      - 'scripts/verify-customer-actions.mjs'
      - '.github/workflows/verify-customer-actions.yml'
  push:
    branches: [main]
    paths:
      - 'customer-dashboard/customer-action-contracts.json'
      - 'customer-dashboard/shared/customer-runtime-*.js'
      - 'customer-dashboard/shared/offer-brand.js'
      - 'scripts/verify-customer-actions.mjs'
      - '.github/workflows/verify-customer-actions.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-customer-actions.mjs
