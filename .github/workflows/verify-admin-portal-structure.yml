name: Verify Admin-Portal Struktur

# Ratsche für den Umbau des Admin-Portals (docs/ADMIN_PORTAL_ZIELBILD_2026-08-10.md).
#
# Das Portal ist deshalb schwer wartbar geworden, weil jede einzelne Korrektur
# vertretbar war und erst die Summe das Problem wurde: 29 Laufzeit-Patches, 16
# zur Laufzeit eingefügte Stylesheets, acht Wrapper um denselben Server-Aufruf.
# Kein Wächter hätte einen dieser Schritte verhindern sollen — aber einer, der
# die Summe sichtbar macht, hätte gereicht.
#
# Dieses Skript lässt die Zahlen nur noch fallen. Wer eine Obergrenze anheben
# will, kann das tun — er muss es dann im PR begründen, statt dass es unbemerkt
# passiert.

on:
  pull_request:
    paths:
      - 'admin-panel/index.html'
      - 'admin-panel/shared/**'
      - 'admin-panel/netlify/functions/admin-mutate.js'
      - 'supabase/migrations/2026-08-10_standalone_credit_notes.sql'
      - 'supabase/migrations/2026-08-10_calls_admin_review.sql'
      - 'scripts/verify-admin-portal-structure.mjs'
      - 'scripts/verify-admin-entry-points.mjs'
      - '.github/workflows/verify-admin-portal-structure.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-admin-portal-structure.mjs
      # Die drei nachgeruesteten Einstiegspunkte: der Knopf muss da sein UND
      # auf eine Gegenstelle zeigen, die es wirklich gibt.
      - run: node scripts/verify-admin-entry-points.mjs
      - run: node --check admin-panel/netlify/functions/admin-mutate.js
      # Syntaxprüfung der Kernmodule. Sie werden als normale Skript-Tags
      # geladen; ein Syntaxfehler würde das Portal beim Start zerlegen.
      - run: node --check admin-panel/shared/core/admin-api.js
      - run: node --check admin-panel/shared/core/admin-format.js
      - run: node --check admin-panel/shared/core/admin-feedback.js
      - run: node --check admin-panel/shared/core/admin-lifecycle.js
      - run: node --test admin-panel/tests/admin-api-routing.test.cjs
      - run: node --test admin-panel/tests/admin-format.test.cjs
