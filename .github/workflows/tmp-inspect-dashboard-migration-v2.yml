name: Temporary Dashboard Migration V2

on:
  pull_request:
    paths:
      - 'scripts/tmp_migrate_dashboard_to_assistant_v2.py'
      - '.github/workflows/tmp-inspect-dashboard-migration-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded dashboard-local migration
        run: python scripts/tmp_migrate_dashboard_to_assistant_v2.py
      - name: Verify migration scope and foundations
        run: |
          test "$(git diff --name-only | tr -d '\r')" = "customer-dashboard/index.html"
          node scripts/verify-customer-design-foundation.mjs
          node scripts/audit-customer-design-ownership.mjs >/tmp/customer-design-ownership.txt
          grep -q 'id="dash-greeting-block" class="vx-page-header"' customer-dashboard/index.html
          grep -q 'id="dash-kpi-strip" class="vx-ap-grid"' customer-dashboard/index.html
          grep -q 'id="dash-priority-section" class="vx-ops-card"' customer-dashboard/index.html
          grep -q 'id="dash-activity-section" class="vx-ops-card"' customer-dashboard/index.html
          ! grep -q 'class="vx-greeting-block"' customer-dashboard/index.html
          ! grep -q 'class="vx-jetzt-section' customer-dashboard/index.html
      - name: Commit migrated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "refactor(customer): migrate dashboard to assistant components"
          git push origin HEAD:${{ github.head_ref }}
