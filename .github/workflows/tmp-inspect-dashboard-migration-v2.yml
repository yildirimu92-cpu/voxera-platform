name: Temporary Dashboard Migration V2

on:
  pull_request:
    paths:
      - 'scripts/tmp_migrate_dashboard_to_assistant_v2.py'
      - '.github/workflows/tmp-inspect-dashboard-migration-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scope dashboard selector migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_migrate_dashboard_to_assistant_v2.py')
          source = path.read_text(encoding='utf-8')
          old = '''source = replace_once(source, old_active_row, new_active_row, 'active row selector')
          source = replace_once(source, "rowEl.closest('.dpr-card')", "rowEl.closest('.dpr-card, .vx-ops-item')", 'click card lookup')
          source = replace_once(source, "rowEl.closest('.dpr-card')", "rowEl.closest('.dpr-card, .vx-ops-item')", 'touch card lookup')
          '''
          new = '''source = replace_once(source, old_active_row, new_active_row, 'active row selector')

          old_toggle_click = read_report_body(REPORT_ROOT / 'functions' / 'dprToggleClick-1.txt')
          new_toggle_click = old_toggle_click.replace(
              "rowEl.closest('.dpr-card')",
              "rowEl.closest('.dpr-card, .vx-ops-item')",
              1,
          )
          if new_toggle_click == old_toggle_click:
              raise AssertionError('click card lookup was not updated')
          source = replace_once(source, old_toggle_click, new_toggle_click, 'click card lookup')

          old_touch_end = read_report_body(REPORT_ROOT / 'functions' / 'dprToggleTouchEnd-1.txt')
          new_touch_end = old_touch_end.replace(
              "rowEl.closest('.dpr-card')",
              "rowEl.closest('.dpr-card, .vx-ops-item')",
              1,
          )
          if new_touch_end == old_touch_end:
              raise AssertionError('touch card lookup was not updated')
          source = replace_once(source, old_touch_end, new_touch_end, 'touch card lookup')
          '''
          if source.count(old) != 1:
              raise SystemExit('expected migration helper block not found exactly once')
          source = source.replace(old, new, 1)

          command_guard = '''    "el.classList.add('dpr-command-center')",\n'''
          if source.count(command_guard) != 1:
              raise SystemExit('expected command-center forbidden guard not found exactly once')
          source = source.replace(command_guard, '', 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply guarded dashboard-local migration
        run: python scripts/tmp_migrate_dashboard_to_assistant_v2.py
      - name: Verify migration scope and foundations
        run: |
          echo '[1/11] migration touches only index.html'
          test "$(git diff --name-only | tr -d '\r')" = "customer-dashboard/index.html"
          echo 'PASS 1'
          echo '[2/11] customer design foundation'
          node scripts/verify-customer-design-foundation.mjs
          echo 'PASS 2'
          echo '[3/11] customer design ownership audit'
          node scripts/audit-customer-design-ownership.mjs >/tmp/customer-design-ownership.txt
          echo 'PASS 3'
          echo '[4/11] assistant page header'
          grep -q 'id="dash-greeting-block" class="vx-page-header"' customer-dashboard/index.html
          echo 'PASS 4'
          echo '[5/11] assistant KPI grid'
          grep -q 'id="dash-kpi-strip" class="vx-ap-grid"' customer-dashboard/index.html
          echo 'PASS 5'
          echo '[6/11] assistant priority card'
          grep -q 'id="dash-priority-section" class="vx-ops-card"' customer-dashboard/index.html
          echo 'PASS 6'
          echo '[7/11] assistant activity card'
          grep -q 'id="dash-activity-section" class="vx-ops-card"' customer-dashboard/index.html
          echo 'PASS 7'
          echo '[8/11] old greeting markup absent'
          ! grep -q 'class="vx-greeting-block"' customer-dashboard/index.html
          echo 'PASS 8'
          echo '[9/11] old priority markup absent'
          ! grep -q 'class="vx-jetzt-section' customer-dashboard/index.html
          echo 'PASS 9'
          echo '[10/11] exactly one command-center owner remains'
          echo "command-center count=$(grep -c "el.classList.add('dpr-command-center')" customer-dashboard/index.html)"
          test "$(grep -c "el.classList.add('dpr-command-center')" customer-dashboard/index.html)" -eq 1
          echo 'PASS 10'
          echo '[11/11] anfragen renderer remains'
          grep -q 'function renderAnrufeInbox' customer-dashboard/index.html
          echo 'PASS 11'
      - name: Commit migrated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-dashboard/index.html
          git commit -m "refactor(customer): migrate dashboard to assistant components"
          git push origin HEAD:${{ github.head_ref }}
