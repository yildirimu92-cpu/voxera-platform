name: Temporary Dashboard Migration V2 Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-dashboard-migration-v2.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact dashboard-owned sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('customer-dashboard/index.html')
          source = source_path.read_text(encoding='utf-8')
          out = Path('tmp/dashboard-migration-v2')
          out.mkdir(parents=True, exist_ok=True)

          def line_no(offset):
              return source.count('\n', 0, offset) + 1

          def matching_brace(start):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(source):
                  ch = source[i]
                  pair = source[i:i + 2]
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if pair == '*/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if pair == '//':
                      line_comment = True
                      i += 2
                      continue
                  if pair == '/*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          dash_start = source.index('<div class="tab-page active" id="tab-dashboard">')
          dash_end = source.index('<!-- ANFRAGEN TAB -->', dash_start)
          dashboard = source[dash_start:dash_end]
          (out / 'host.txt').write_text(
              f'LINES {line_no(dash_start)}-{line_no(dash_end)}\n\n' + dashboard,
              encoding='utf-8'
          )

          function_pattern = re.compile(r'(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{')
          terms = (
              'dash-priority', 'dash-activity', 'dash-kpi', 'dash-greeting',
              'vx-activity', 'vx-group', 'vx-jetzt', 'renderDashboard'
          )
          function_parts = []
          seen = set()
          for match in function_pattern.finditer(source):
              brace = source.index('{', match.start())
              try:
                  end = matching_brace(brace)
              except RuntimeError:
                  continue
              body = source[match.start():end]
              if not any(term in body for term in terms):
                  continue
              key = (match.group(1), match.start())
              if key in seen:
                  continue
              seen.add(key)
              function_parts.append(
                  f'===== {match.group(1)} | LINES {line_no(match.start())}-{line_no(end)} =====\n{body}\n'
              )
          (out / 'functions.txt').write_text('\n'.join(function_parts), encoding='utf-8')

          style_pattern = re.compile(r'<style\b[^>]*>(.*?)</style>', re.S | re.I)
          selector_terms = (
              '#tab-dashboard', '#dash-', '.dash-', '.vx-greeting-', '.vx-kpi-',
              '.vx-jetzt-', '.vx-activity-', '.vx-group-', '.dpr-command-center', '.fse-'
          )
          rule_pattern = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          css_parts = []
          selector_count = 0
          mixed_count = 0
          for style_index, style in enumerate(style_pattern.finditer(source), 1):
              css = style.group(1)
              for rule in rule_pattern.finditer(css):
                  selector = rule.group(1).strip()
                  if not any(term in selector for term in selector_terms):
                      continue
                  selector_count += 1
                  absolute = style.start(1) + rule.start()
                  mixed = any(token in selector.lower() for token in (
                      'login', 'loading', 'splash', 'sidebar', 'side-nav',
                      'mobile-nav', 'bottom-nav', 'mobile-bottom', 'tour', 'modal'
                  ))
                  mixed_count += int(mixed)
                  css_parts.append(
                      f'===== RULE {selector_count} | STYLE {style_index} | LINE {line_no(absolute)} | MIXED_SHARED={str(mixed).lower()} =====\n'
                      + selector + ' {' + rule.group(2) + '}\n'
                  )

          shared_terms = {
              'login': ('login', 'auth-card', 'login-card'),
              'loading': ('loading', 'splash', 'boot'),
              'sidebar': ('sidebar', 'side-nav'),
              'mobile_navigation': ('mobile-nav', 'bottom-nav', 'mobile-bottom'),
              'tour': ('tour', 'onboarding-modal', 'tour-modal'),
          }
          fingerprints = []
          for name, needles in shared_terms.items():
              relevant = []
              for style in style_pattern.finditer(source):
                  css = style.group(1)
                  for rule in rule_pattern.finditer(css):
                      selector = ' '.join(rule.group(1).split())
                      if any(needle in selector.lower() for needle in needles):
                          relevant.append(selector + '{' + rule.group(2) + '}')
              payload = '\n'.join(relevant)
              fingerprints.append(
                  f'{name}: rules={len(relevant)} sha256={hashlib.sha256(payload.encode()).hexdigest()}'
              )

          header = (
              f'DASHBOARD_SELECTOR_RULES={selector_count}\n'
              f'MIXED_SHARED_RULES={mixed_count}\n'
              + '\n'.join(fingerprints)
              + '\n\n'
          )
          (out / 'css.txt').write_text(header + '\n'.join(css_parts), encoding='utf-8')

          inline = [
              f'line={line_no(dash_start + match.start())} {match.group(0)}'
              for match in re.finditer(r'style="[^"]*"', dashboard)
          ]
          (out / 'inline-styles.txt').write_text('\n'.join(inline) + '\n', encoding='utf-8')
          PY
      - name: Commit inspection reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/dashboard-migration-v2
          if git diff --cached --quiet; then
            echo "Reports unchanged."
            exit 0
          fi
          git commit -m "chore: capture dashboard migration boundaries"
          git push origin HEAD:${{ github.head_ref }}
