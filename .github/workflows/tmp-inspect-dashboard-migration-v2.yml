name: Temporary Dashboard Migration V2 Inspection

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-inspect-dashboard-migration-v2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect dashboard-local boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source = Path('customer-dashboard/index.html').read_text(encoding='utf-8')

          def line_no(offset):
              return source.count('\n', 0, offset) + 1

          def matching_brace(start):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(source):
                  ch = source[i]
                  pair = source[i:i + 2]
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if pair == '*/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if pair == '//':
                      line_comment = True
                      i += 2
                      continue
                  if pair == '/*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i + 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          dash_start = source.index('<div class="tab-page active" id="tab-dashboard">')
          dash_end = source.index('<!-- ANFRAGEN TAB -->', dash_start)
          dashboard = source[dash_start:dash_end]

          print('===== DASHBOARD HOST =====')
          print(f'start_line={line_no(dash_start)} end_line={line_no(dash_end)} chars={len(dashboard)}')
          for rel_no, line in enumerate(dashboard.splitlines(), line_no(dash_start)):
              compact = line.strip()
              if compact and any(token in compact for token in ('id=', 'class=', 'style=', '<button', '<h1', '<h2', '<h3')):
                  print(f'{rel_no}: {compact[:700]}')

          print('\n===== DASHBOARD FUNCTIONS =====')
          function_pattern = re.compile(r'(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{')
          terms = ('dash-priority', 'dash-activity', 'dash-kpi', 'dash-greeting', 'vx-activity', 'vx-group', 'vx-jetzt', 'renderDashboard')
          for match in function_pattern.finditer(source):
              brace = source.index('{', match.start())
              try:
                  end = matching_brace(brace)
              except RuntimeError:
                  continue
              body = source[match.start():end]
              if not any(term in body for term in terms):
                  continue
              print(f'FUNCTION {match.group(1)} lines={line_no(match.start())}-{line_no(end)} chars={len(body)}')
              for rel_no, line in enumerate(body.splitlines(), line_no(match.start())):
                  compact = line.strip()
                  if compact and any(token in compact for token in ('innerHTML', 'insertAdjacentHTML', 'class=', 'style=', 'dash-', 'vx-')):
                      print(f'  {rel_no}: {compact[:850]}')

          print('\n===== DASHBOARD SELECTOR INDEX =====')
          style_pattern = re.compile(r'<style\b[^>]*>(.*?)</style>', re.S | re.I)
          selector_terms = ('#tab-dashboard', '#dash-', '.dash-', '.vx-greeting-', '.vx-kpi-', '.vx-jetzt-', '.vx-activity-', '.vx-group-', '.dpr-command-center', '.fse-')
          rule_pattern = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
          selectors = []
          for style_index, style in enumerate(style_pattern.finditer(source), 1):
              css = style.group(1)
              for rule in rule_pattern.finditer(css):
                  selector = ' '.join(rule.group(1).split())
                  if any(term in selector for term in selector_terms):
                      absolute = style.start(1) + rule.start()
                      mixed = any(token in selector.lower() for token in ('login', 'loading', 'sidebar', 'mobile-nav', 'bottom-nav', 'tour', 'modal'))
                      selectors.append((line_no(absolute), style_index, mixed, selector))
          print(f'total={len(selectors)}')
          for number, style_index, mixed, selector in selectors:
              print(f'line={number} style={style_index} mixed_shared={str(mixed).lower()} selector={selector[:1200]}')

          print('\n===== SHARED SURFACE FINGERPRINTS =====')
          shared_terms = {
              'login': ('login', 'auth-card', 'login-card'),
              'loading': ('loading', 'splash', 'boot'),
              'sidebar': ('sidebar', 'side-nav'),
              'mobile_navigation': ('mobile-nav', 'bottom-nav', 'mobile-bottom'),
              'tour': ('tour', 'onboarding-modal', 'tour-modal'),
          }
          for name, needles in shared_terms.items():
              relevant = []
              for style in style_pattern.finditer(source):
                  css = style.group(1)
                  for rule in rule_pattern.finditer(css):
                      selector = ' '.join(rule.group(1).split())
                      if any(needle in selector.lower() for needle in needles):
                          relevant.append(selector + '{' + rule.group(2) + '}')
              payload = '\n'.join(relevant)
              print(f'{name}: rules={len(relevant)} sha256={hashlib.sha256(payload.encode()).hexdigest()}')

          print('\n===== DASHBOARD HOST INLINE STYLES =====')
          for match in re.finditer(r'style="[^"]*"', dashboard):
              print(f'line={line_no(dash_start + match.start())} value={match.group(0)}')
          PY
