<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Voxera Admin – Login</title>
  <link rel="icon" type="image/svg+xml" href="/brand/05-app-icon-512px.svg">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g600:#4B5563;--g900:#111827;
      --blue:#1A6FE8;--red:#DC2626;--red-light:#FEF2F2;
    }
    body{
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      background:linear-gradient(145deg,#0D1F3C 0%,#122444 40%,#1A3060 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;overflow:hidden;position:relative;
    }
    body::before{
      content:'';position:absolute;top:-120px;right:-120px;
      width:400px;height:400px;border-radius:50%;
      background:radial-gradient(circle,rgba(26,111,232,.18) 0%,transparent 70%);
      pointer-events:none;
    }
    body::after{
      content:'';position:absolute;bottom:-100px;left:-80px;
      width:320px;height:320px;border-radius:50%;
      background:radial-gradient(circle,rgba(232,197,71,.07) 0%,transparent 70%);
      pointer-events:none;
    }
    .card{
      position:relative;z-index:2;
      background:#FFFFFF;border:1px solid #E5E7EB;border-radius:22px;
      padding:40px 36px 36px;max-width:400px;width:100%;
      box-shadow:0 24px 64px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.8);
      text-align:center;
      animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
    .logo-ico{
      width:52px;height:52px;border-radius:14px;background:#0D1F3C;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:10px;box-shadow:0 4px 16px rgba(13,31,60,.25);overflow:hidden;
    }
    .logo-ico img{width:100%;height:100%;object-fit:cover;display:block;}
    .logo-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:#0D1F3C;letter-spacing:-.04em;margin-bottom:3px;}
    .logo-tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9CA3AF;}
    .admin-badge{
      display:inline-flex;align-items:center;gap:5px;
      background:#EFF6FF;border:1px solid #BFDBFE;border-radius:99px;
      padding:4px 12px;font-size:11px;font-weight:700;color:#1D4ED8;
      letter-spacing:.05em;text-transform:uppercase;margin-top:10px;margin-bottom:4px;
    }
    .login-sub{font-size:13.5px;color:#6B7280;margin-bottom:28px;line-height:1.55;}
    .form{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;text-align:left;}
    .field label{display:block;font-size:11px;font-weight:700;color:#4B5563;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
    .field input{
      width:100%;padding:12px 14px;
      background:#F3F4F6;border:1.5px solid #E5E7EB;
      border-radius:11px;font-size:14px;font-family:'DM Sans',sans-serif;
      color:#111827;outline:none;
      transition:border .15s,box-shadow .15s,background .15s;
    }
    .field input::placeholder{color:#9CA3AF;}
    .field input:focus{border-color:#1A6FE8;background:#FFFFFF;box-shadow:0 0 0 3px rgba(26,111,232,.1);}
    .field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus{
      -webkit-box-shadow:0 0 0 1000px #F3F4F6 inset !important;
      -webkit-text-fill-color:#111827 !important;
    }
    .btn{
      display:block;width:100%;padding:13px;
      background:#1A6FE8;color:#FFFFFF;border:none;border-radius:12px;
      font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
      cursor:pointer;letter-spacing:-.01em;
      transition:all .15s;box-shadow:0 4px 20px rgba(26,111,232,.3);
    }
    .btn:hover{background:#1340B0;transform:translateY(-1px);box-shadow:0 6px 24px rgba(26,111,232,.4);}
    .btn:active{transform:translateY(0);}
    .btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
    .error{
      background:#FEF2F2;border:1px solid #FECACA;border-radius:9px;
      padding:10px 14px;font-size:13px;color:#DC2626;
      margin-bottom:16px;text-align:left;display:none;line-height:1.5;
    }
    .note{font-size:12px;color:#9CA3AF;margin-top:16px;line-height:1.6;}
    .security-badge{
      display:flex;align-items:center;justify-content:center;gap:5px;
      font-size:11px;color:#9CA3AF;margin-top:14px;
    }
    @media(max-width:480px){
      body{align-items:flex-start;padding:24px 16px;overflow-y:auto;}
      .card{border-radius:20px;padding:32px 20px 28px;margin:auto 0;}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-ico">
        <img src="/brand/05-app-icon-512px.svg" alt="Voxera">
      </div>
      <div class="logo-name">VOXERA</div>
      <div class="logo-tag">Kundenassistent</div>
    </div>
    <div class="admin-badge">
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="12" height="8" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
      Admin Portal
    </div>
    <div class="login-sub" style="font-size:13px;color:#6B7280;margin-top:6px;margin-bottom:24px;">Interner Zugang – nur für autorisierte Mitarbeitende.</div>

    <div class="error" id="login-error"></div>

    <div class="form">
      <div class="field">
        <label for="login-email">E-Mail</label>
        <input type="email" id="login-email" placeholder="admin@voxera.ch" autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <button class="btn" id="login-btn" onclick="doLogin()">Anmelden</button>

    <div class="security-badge">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2L3 4v4c0 3 2.5 5.5 5 6 2.5-.5 5-3 5-6V4L8 2z"/></svg>
      Gesicherter Admin-Bereich · Nur für interne Nutzung
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ulcofbgrovgcvowdjrge.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY29mYmdyb3ZnY3Zvd2RqcmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUzMzAsImV4cCI6MjA5MDUyMTMzMH0.AA9zTqp9WryVRG5TxbhE1ed9yBerDOBAanfWhKNfAyk';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function clearError() {
      document.getElementById('login-error').style.display = 'none';
    }

    document.getElementById('login-email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-password').focus();
    });
    document.getElementById('login-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      clearError();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }
      btn.disabled = true;
      btn.textContent = 'Anmelden…';
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data?.session) throw new Error('Session fehlt nach Login.');
        // Check admin role
        const { data: admin, error: adminErr } = await sb
          .from('admins').select('id,role,status').eq('id', data.session.user.id).maybeSingle();
        if (adminErr || !admin) { await sb.auth.signOut(); showError('Kein Admin-Zugang für dieses Konto.'); return; }
        const allowedRoles = ['owner','admin','superadmin','super-admin','ops','support'];
        if (!allowedRoles.includes(String(admin.role||'').toLowerCase().replace(/_/g,'-'))) {
          await sb.auth.signOut(); showError('Ihre Rolle hat keinen Zugang zum Admin-Portal.'); return;
        }
        if (String(admin.status||'active').toLowerCase() !== 'active') {
          await sb.auth.signOut(); showError('Ihr Admin-Konto ist deaktiviert.'); return;
        }
        window.location.replace('/');
      } catch(e) {
        const msg = String(e?.message || '');
        if (msg.includes('Invalid login')) showError('E-Mail oder Passwort falsch.');
        else if (msg.includes('Email not confirmed')) showError('E-Mail noch nicht bestätigt.');
        else showError(msg || 'Anmeldung fehlgeschlagen.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Anmelden';
      }
    }

    // Auto-redirect if already logged in
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) window.location.replace('/');
    })();
  </script>
</body>
</html>
