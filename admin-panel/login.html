<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Voxera Admin</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta name="theme-color" content="#1A56DB">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#1A56DB;--blue-dark:#1340B0;--blue-light:#EBF0FC;--blue-mid:#C7D9F8;
  --green:#16A34A;--green-light:#DCFCE7;--green-mid:#BBF7D0;
  --red:#DC2626;--red-light:#FEE2E2;
  --amber:#D97706;--amber-light:#FEF3C7;--amber-mid:#FDE68A;
  --gray50:#F9FAFB;--gray100:#F3F4F6;--gray200:#E5E7EB;
  --gray400:#9CA3AF;--gray600:#4B5563;--gray900:#111827;
  --white:#FFFFFF;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.08);
  --shadow-blue:0 4px 14px rgba(26,86,219,0.25);
}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;font-size:14px;
  color:var(--gray900);background:var(--gray50);
  min-height:100vh;overflow-x:hidden;
}

/* ═══ LOGIN (identisch mit Dashboard) ═══ */
#login-screen{
  display:flex;position:fixed;inset:0;z-index:999;
  background:linear-gradient(135deg,#F0F4FF 0%,#F9FAFB 40%,#EFF6FF 100%);
  align-items:center;justify-content:center;padding:20px;overflow:hidden;
}
.login-card{
  position:relative;z-index:2;
  background:var(--white);border:1px solid var(--gray200);border-radius:20px;
  padding:44px 40px;max-width:420px;width:100%;
  box-shadow:0 8px 32px rgba(26,86,219,0.08),var(--shadow-sm);
  text-align:center;
  animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.login-logo{font-family:'Bricolage Grotesque',sans-serif;font-size:32px;font-weight:800;color:var(--blue);letter-spacing:-.03em;margin-bottom:4px;}
.login-tag{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray400);margin-bottom:24px;}
.login-sub{font-size:14px;color:var(--gray600);margin-bottom:32px;line-height:1.6;}
.login-form{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;text-align:left;}
.login-field label{display:block;font-size:11.5px;font-weight:600;color:var(--gray600);margin-bottom:6px;letter-spacing:.03em;}
.login-field input{
  width:100%;padding:12px 16px;
  background:var(--gray50);border:1.5px solid var(--gray200);
  border-radius:10px;font-size:14px;font-family:inherit;
  color:var(--gray900);outline:none;transition:all .2s;
}
.login-field input::placeholder{color:var(--gray400);}
.login-field input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.login-btn{
  display:block;width:100%;padding:13px;
  background:var(--blue);color:var(--white);border:none;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .2s;box-shadow:var(--shadow-blue);
}
.login-btn:hover{background:var(--blue-dark);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,86,219,.35);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
.login-note{font-size:12px;color:var(--gray400);line-height:1.6;margin-top:6px;}
.login-note a{color:var(--blue);text-decoration:none;font-weight:500;}
.login-note a:hover{text-decoration:underline;}
.login-links{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.login-divider{height:1px;background:var(--gray200);margin:12px 0;}
.login-error{
  background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;
  padding:10px 14px;font-size:12.5px;color:var(--red);
  margin-bottom:16px;text-align:left;display:none;
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Voxera</div>
    <div class="login-tag">Admin Portal</div>
    <div class="login-sub">Melden Sie sich mit Ihrem Admin-Konto an</div>
    <div class="login-error" id="login-error"></div>
    <div class="login-form">
      <div class="login-field">
        <label>E-Mail</label>
        <input type="email" id="login-email" placeholder="admin@voxera.ch" autocomplete="email">
      </div>
      <div class="login-field">
        <label>Passwort</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">Anmelden</button>
    </div>
    <div class="login-links">
      <div class="login-note"><a href="javascript:void(0)" onclick="forgotPassword()">Passwort vergessen?</a></div>
    </div>
  </div>
</div>

<script>
'use strict';

const SB_URL = 'https://ulcofbgrovgcvowdjrge.supabase.co';
const SB_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY29mYmdyb3ZnY3Zvd2RqcmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUzMzAsImV4cCI6MjA5MDUyMTMzMH0.AA9zTqp9WryVRG5TxbhE1ed9yBerDOBAanfWhKNfAyk';

const supabaseLib = window.supabase;
const ADMIN_AUTH_STORAGE_KEY = 'voxera-admin-session';
function getPreferredAuthStorage() {
  const candidates = [window.sessionStorage, window.localStorage];
  for (const storage of candidates) {
    if (!storage) continue;
    try {
      const probe = '__voxera_auth_probe__';
      storage.setItem(probe, '1');
      storage.removeItem(probe);
      return storage;
    } catch (_e) {}
  }
  return undefined;
}
const authStorage = getPreferredAuthStorage();
const sb = (supabaseLib && typeof supabaseLib.createClient === 'function')
  ? supabaseLib.createClient(SB_URL, SB_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: ADMIN_AUTH_STORAGE_KEY,
        storage: authStorage
      }
    })
  : null;
const ALLOWED_ADMIN_ROLES = new Set(['super-admin','admin','support','owner','ops']);
function normalizeAdminRole(role){
  const raw = String(role || '').trim().toLowerCase().replace(/_/g, '-');
  if (!raw) return '';
  if (raw === 'superadmin') return 'super-admin';
  return raw;
}
function isAllowedAdminRole(role){
  const normalized = normalizeAdminRole(role);
  return !normalized || ALLOWED_ADMIN_ROLES.has(normalized);
}

// Session-Check: Wenn bereits eingeloggt, direkt weiterleiten
(async () => {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    // Prüfe ob User ein Admin ist
    const { data: admin } = await sb.from('admins').select('id,role').eq('id', session.user.id).single();
    if (admin && isAllowedAdminRole(admin.role)) {
      window.location.href = 'index.html';
    } else {
      // Kein Admin → Session löschen
      await sb.auth.signOut();
    }
  }
})();

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('login-error').style.display = 'none';
}

async function doLogin() {
  if (!sb) { showError('Supabase konnte nicht geladen werden. Seite neu laden.'); return; }
  hideError();

  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }

  btn.disabled = true;
  btn.textContent = 'Anmelden...';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // Admin-Check: User muss in admins-Tabelle sein
    const { data: admin, error: adminError } = await sb.from('admins').select('id,role').eq('id', data.user.id).single();
    if (adminError || !admin || !isAllowedAdminRole(admin.role)) {
      await sb.auth.signOut();
      showError('Kein Admin-Zugang. Dieser Account hat keine Berechtigung für das Admin Portal.');
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      return;
    }

    window.location.href = 'index.html';
  } catch (e) {
    showError(e.message === 'Invalid login credentials'
      ? 'E-Mail oder Passwort ist falsch.'
      : e.message);
    btn.disabled = false;
    btn.textContent = 'Anmelden';
  }
}

async function forgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showError('Bitte zuerst E-Mail eingeben.'); return; }
  if (!sb) { showError('Supabase konnte nicht geladen werden. Seite neu laden.'); return; }
  hideError();
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://admin.voxera.ch'
  });
  if (error) { showError(error.message); return; }
  const el = document.getElementById('login-error');
  el.style.cssText = 'display:block;background:var(--green-light);border:1px solid var(--green-mid);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--green);margin-bottom:16px;text-align:left;';
  el.textContent = 'Reset-Link wurde an ' + email + ' gesendet.';
}

// Enter-Taste zum Absenden
document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login-email').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-password').focus();
});
</script>
</body>
</html>
