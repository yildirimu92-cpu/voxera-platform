<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Voxera Admin</title>
<link rel="icon" type="image/svg+xml" href="/brand/05-app-icon-512px.svg">
<link rel="apple-touch-icon" href="/brand/05-app-icon-512px.svg">
<meta name="theme-color" content="#0D1F3C">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<script src="/shared/offer-brand.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ── VOXERA CI TOKENS ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --night:#0D1F3C;
  --night2:#122444;
  --blue:#1A6FE8;
  --blue-dark:#1340B0;
  --sky:#4B9FFF;
  --gold:#E8C547;
  --white:#FFFFFF;
  --off:#F7F8FC;
  --g100:#F1F5F9;
  --g200:#E2E8F0;
  --g400:#94A3B8;
  --g600:#475569;
  --g900:#0F172A;
  --green:#059669;
  --green-light:#ECFDF5;
  --green-mid:#A7F3D0;
  --red:#DC2626;
  --red-light:#FEF2F2;

  /* Legacy aliases für JS-Kompatibilität */
  --vx-night:var(--night);
  --vx-blue:var(--blue);
  --vx-sky:var(--sky);
  --vx-gold:var(--gold);
  --vx-bg:var(--off);
  --vx-surface:var(--white);
  --vx-ink:var(--g900);
  --vx-muted:var(--g600);
  --vx-line:var(--g200);
  --blue-light:#EFF6FF;
  --blue-mid:#BFDBFE;
  --amber:#D97706;
  --amber-light:#FEF3C7;
  --amber-mid:#FDE68A;
  --gray50:var(--off);
  --gray100:var(--g100);
  --gray200:var(--g200);
  --gray400:var(--g400);
  --gray600:var(--g600);
  --gray900:var(--g900);
  --radius:10px;
  --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.08);
  --shadow-blue:0 4px 20px rgba(26,111,232,0.3);
}

html{scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  color:var(--g900);
  background:var(--off);
  min-height:100vh;
  overflow-x:hidden;
}

/* ══ LOGIN SCREEN ══ */
#login-screen{
  display:flex;
  position:fixed;
  inset:0;
  z-index:999;
  background:linear-gradient(145deg,#0D1F3C 0%,#122444 40%,#1A3060 100%);
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

/* Hintergrund-Orbs */
#login-screen::before{
  content:'';
  position:absolute;
  top:-120px;
  right:-120px;
  width:400px;
  height:400px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(26,111,232,.18) 0%,transparent 70%);
  pointer-events:none;
}
#login-screen::after{
  content:'';
  position:absolute;
  bottom:-100px;
  left:-80px;
  width:320px;
  height:320px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(232,197,71,.07) 0%,transparent 70%);
  pointer-events:none;
}

/* ── Login Card ── */
.login-card{
  position:relative;
  z-index:2;
  background:var(--white);
  border:1px solid var(--g200);
  border-radius:22px;
  padding:40px 36px 36px;
  max-width:400px;
  width:100%;
  box-shadow:
    0 24px 64px rgba(0,0,0,.3),
    0 4px 16px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.8);
  text-align:center;
  animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

/* Logo Bereich */
.login-logo-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:24px;
}
.login-logo-ico{
  width:52px;
  height:52px;
  border-radius:14px;
  background:var(--night);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  box-shadow:0 4px 16px rgba(13,31,60,.25);
}
.login-logo{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:22px;
  font-weight:800;
  color:var(--night);
  letter-spacing:-.04em;
  margin-bottom:3px;
}
.login-tag{
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--g400);
}
.login-sub{
  font-size:14px;
  color:var(--g600);
  margin-bottom:28px;
  line-height:1.55;
}

/* Formular */
.login-form{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:16px;
  text-align:left;
}
.login-field label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--g600);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:6px;
}
.login-field input{
  width:100%;
  padding:12px 14px;
  background:var(--g100);
  border:1.5px solid var(--g200);
  border-radius:11px;
  font-size:14px;
  font-family:'DM Sans',sans-serif;
  color:var(--g900);
  outline:none;
  transition:border .15s,box-shadow .15s,background .15s;
}
.login-field input::placeholder{color:var(--g400);}
.login-field input:focus{
  border-color:var(--blue);
  background:var(--white);
  box-shadow:0 0 0 3px rgba(26,111,232,.1);
}

/* Autofill Safari Fix */
.login-field input:-webkit-autofill,
.login-field input:-webkit-autofill:hover,
.login-field input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px var(--g100) inset !important;
  -webkit-text-fill-color:var(--g900) !important;
  transition:background-color 5000s ease-in-out 0s;
}

/* Login Button */
.login-btn{
  display:block;
  width:100%;
  padding:13px;
  background:var(--blue);
  color:var(--white);
  border:none;
  border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:-.01em;
  transition:all .15s;
  box-shadow:var(--shadow-blue);
}
.login-btn:hover{
  background:var(--blue-dark);
  transform:translateY(-1px);
  box-shadow:0 6px 24px rgba(26,111,232,.4);
}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{
  opacity:.5;
  cursor:default;
  transform:none;
  box-shadow:none;
}

/* Links */
.login-links{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:4px;
}
.login-note{
  font-size:12.5px;
  color:var(--g400);
  line-height:1.6;
  margin-top:2px;
}
.login-note a{
  color:var(--blue);
  text-decoration:none;
  font-weight:600;
}
.login-note a:hover{text-decoration:underline;}

.login-divider{
  height:1px;
  background:var(--g200);
  margin:12px 0;
}

/* Error */
.login-error{
  background:var(--red-light);
  border:1px solid #FECACA;
  border-radius:9px;
  padding:10px 14px;
  font-size:13px;
  color:var(--red);
  margin-bottom:16px;
  text-align:left;
  display:none;
  line-height:1.5;
}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  #login-screen{
    align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .login-card{
    margin:0 auto auto;
    max-width:none;
    border-radius:20px;
    padding:28px 20px 24px;
  }
  .login-sub{font-size:13px;margin-bottom:20px;}
  .login-form{gap:10px;}
  .login-field input{padding:11px 12px;}
  .login-btn{padding:12px;font-size:14px;}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo-wrap">
      <div class="login-logo-ico">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <path d="M24 6 C14 6,5 14,5 24" stroke="#4B9FFF" stroke-width="4" stroke-linecap="round"/>
          <path d="M24 6 C34 6,43 14,43 24" stroke="#E8C547" stroke-width="4" stroke-linecap="round"/>
          <path d="M5 24 C5 35,13 43,24 43 C35 43,43 35,43 24" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <path d="M16 16 L24 29 L32 16" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="login-logo">VOXERA</div>
      <div class="login-tag">Admin Portal</div>
    </div>

    <div class="login-sub">Melden Sie sich mit Ihrem Admin-Konto an</div>

    <div class="login-error" id="login-error"></div>

    <div class="login-form">
      <div class="login-field">
        <label>E-Mail</label>
        <input type="email" id="login-email" placeholder="admin@voxera.ch" autocomplete="email">
      </div>
      <div class="login-field">
        <label>Passwort</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">Anmelden</button>
    </div>

    <div class="login-links">
      <div class="login-note">
        <a href="javascript:void(0)" onclick="forgotPassword()">Passwort vergessen?</a>
      </div>
    </div>

  </div>
</div>

<!-- ══ SCRIPTS — UNVERÄNDERT ══ -->
<script>
'use strict';

const BRAND_LOGO_PATH=(window.VoxeraOfferBrand&&window.VoxeraOfferBrand.BRAND_LOGO_PATH)||'/brand/05-app-icon-512px.svg';
const BRAND_FAVICON_PATH=(window.VoxeraOfferBrand&&window.VoxeraOfferBrand.BRAND_FAVICON_PATH)||BRAND_LOGO_PATH;

const SUPABASE_URL = 'https://ulcofbgrovgcvowdjrge.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY29mYmdyb3ZnY3Zvd2RqcmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUzMzAsImV4cCI6MjA5MDUyMTMzMH0.AA9zTqp9WryVRG5TxbhE1ed9yBerDOBAanfWhKNfAyk';

const supabaseLib = window.supabase;
const ADMIN_AUTH_STORAGE_KEY = 'voxera-admin-session';
function getPreferredAuthStorage() {
  const candidates = [window.sessionStorage, window.localStorage];
  for (const storage of candidates) {
    if (!storage) continue;
    try {
      const probe = '__voxera_auth_probe__';
      storage.setItem(probe, '1');
      storage.removeItem(probe);
      return storage;
    } catch (_e) {}
  }
  return undefined;
}
const authStorage = getPreferredAuthStorage();
const sb = (supabaseLib && typeof supabaseLib.createClient === 'function')
  ? supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false,
        storageKey: ADMIN_AUTH_STORAGE_KEY,
        storage: authStorage
      }
    })
  : null;
const ALLOWED_ADMIN_ROLES = new Set(['super-admin','admin','support','owner','ops']);
function normalizeAdminRole(role){
  const raw = String(role || '').trim().toLowerCase().replace(/_/g, '-');
  if (!raw) return '';
  if (raw === 'superadmin') return 'super-admin';
  return raw;
}
function isAllowedAdminRole(role){
  const normalized = normalizeAdminRole(role);
  return !normalized || ALLOWED_ADMIN_ROLES.has(normalized);
}

(async () => {
  if (!sb) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: admin } = await sb.from('admins').select('id,role').eq('id', session.user.id).single();
      if (admin && isAllowedAdminRole(admin.role)) {
        window.location.replace('index.html');
      } else {
        await sb.auth.signOut();
      }
    }
  } catch (_e) {
    try { await sb.auth.signOut(); } catch (__e) {}
  }
})();

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('login-error').style.display = 'none';
}

async function doLogin() {
  if (!sb) { showError('Supabase konnte nicht geladen werden. Seite neu laden.'); return; }
  hideError();

  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }

  btn.disabled = true;
  btn.textContent = 'Anmelden…';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const { data: admin, error: adminError } = await sb.from('admins').select('id,role').eq('id', data.user.id).single();
    if (adminError || !admin || !isAllowedAdminRole(admin.role)) {
      await sb.auth.signOut();
      showError('Kein Admin-Zugang. Dieser Account hat keine Berechtigung für das Admin Portal.');
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      return;
    }

    window.location.replace('index.html');
  } catch (e) {
    showError(e.message === 'Invalid login credentials'
      ? 'E-Mail oder Passwort ist falsch.'
      : e.message);
    btn.disabled = false;
    btn.textContent = 'Anmelden';
  }
}

async function forgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showError('Bitte zuerst E-Mail eingeben.'); return; }
  if (!sb) { showError('Supabase konnte nicht geladen werden. Seite neu laden.'); return; }
  hideError();
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://admin.voxera.ch'
  });
  if (error) { showError(error.message); return; }
  const el = document.getElementById('login-error');
  el.style.cssText = 'display:block;background:var(--green-light);border:1px solid var(--green-mid);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--green);margin-bottom:16px;text-align:left;';
  el.textContent = 'Reset-Link wurde an ' + email + ' gesendet.';
}

document.getElementById('login-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('login-email').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('login-password').focus();
});
</script>
</body>
</html>
