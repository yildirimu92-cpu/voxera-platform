<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
    <div class="login-container">
        <form id="login-form">
            <h2>Login</h2>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="loading" class="hidden">Loading...</div>
            <div id="error-message" class="hidden"></div>
        </form>
    </div>
    <script>
        const form = document.getElementById('login-form');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');

        const SB_URL = 'https://ulcofbgrovgcvowdjrge.supabase.co';
        const SB_ANON_KEY = 'sb_publishable_TShqsOXWSF5m3oQYHmPI8w_KNdSAXJ6'; // TODO: Ersetzen, falls weiterhin "Unregistered API key" erscheint

        const supabaseLib = window.supabase;
        const sb = (supabaseLib && typeof supabaseLib.createClient === 'function')
            ? supabaseLib.createClient(SB_URL, SB_ANON_KEY)
            : null;

        if (!sb) {
            errorMessage.textContent = 'Supabase konnte nicht geladen werden. Bitte Seite neu laden.';
            errorMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!sb) return;

            loading.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await sb.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;
                console.log('User logged in:', data.user);
                window.location.href = 'index.html';
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
