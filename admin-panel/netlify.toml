[build]
  publish = "."
  functions = "netlify/functions"
  # Siehe customer-dashboard/netlify.toml — erzeugt vx-runtime-config.js aus den
  # Netlify-Env-Variablen und bricht bei fehlenden Variablen bewusst nicht ab.
  command = "node tools/build-runtime-config.mjs"

[functions."outbox-retry-worker"]
  schedule = "*/5 * * * *"

[functions."daily-billing-runner"]
  schedule = "0 6 * * *"

[functions."lifecycle-runner"]
  schedule = "15 4 * * *"

# S4 / Stufe 2: arbeitet die Fan-out-Warteschlange ab. Haeufiger Tick, kleine
# Batches -- ein Sync kostet 4-7 ElevenLabs-Aufrufe und Netlify schneidet bei
# ~26s ab. Findet der Worker nichts, kostet er eine Leseabfrage.
[functions."fanout-sync-worker"]
  schedule = "*/5 * * * *"

# S4 / Stufe 3: plant naechtlich ein, was nicht auf dem aktuellen Stand ist.
# Nachts und nicht bei jedem Deploy: ein zeitgesteuerter Lauf deckt beide
# Faelle ab -- veraltete Vorlagen UND abgelaufene Betriebsinformationen (S3) --
# und laeuft nie mitten in eine gerade laufende Auslieferung.
[functions."fanout-sync-planner"]
  schedule = "40 3 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
