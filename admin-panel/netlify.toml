[build]
  publish = "."
  functions = "netlify/functions"
  # Siehe customer-dashboard/netlify.toml — erzeugt vx-runtime-config.js aus den
  # Netlify-Env-Variablen und bricht bei fehlenden Variablen bewusst nicht ab.
  command = "node tools/build-runtime-config.mjs"

[functions."outbox-retry-worker"]
  schedule = "*/5 * * * *"

[functions."daily-billing-runner"]
  schedule = "0 6 * * *"

[functions."lifecycle-runner"]
  schedule = "15 4 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
